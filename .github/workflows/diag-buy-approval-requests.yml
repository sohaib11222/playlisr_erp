# READ-ONLY diagnostic: how many active, login-enabled staff have a mobile
# number on file (contact_number) vs not — informs whether the new
# task/project-assignment SMS notifications will actually reach people.
name: Diag buy approval requests

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Count staff with/without a phone number (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 60s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            for f in $(ls -t storage/app/buy-approvals/*.json 2>/dev/null | head -10); do php -r '$r=json_decode(file_get_contents($argv[1]),true); echo $r["created_at"]." cashier=".$r["cashier_name"]." loc_id=".var_export($r["location_id"],true)." loc=".$r["location_name"]." approver=".$r["approver_name"]." paid=".$r["paid"]." auto=".$r["auto"]." status=".$r["status"]."\n";' "$f"; done
            echo "=== done ==="
