# READ-ONLY diagnostic: for a comma-separated list of SKUs, dump the ERP
# product row's internal id, discogs_release_id, listing_location, and
# business location — used to check whether a website product's discogId
# (suspected to be a mis-copied Discogs release id) actually corresponds to
# something else, like the ERP's own internal product id. No writes.
name: Diag check SKUs

on:
  workflow_dispatch:
    inputs:
      skus:
        description: "Comma-separated SKUs to look up (products.sku)"
        required: true

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Look up SKUs (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            SKUS="${{ github.event.inputs.skus }}"
            echo "=== looking up SKUs: $SKUS ==="
            php artisan tinker --no-ansi <<PHP
            \$skuList = array_map('trim', explode(',', "$SKUS"));
            \$rows = \Illuminate\Support\Facades\DB::table('products')->whereIn('sku', \$skuList)->get(['id', 'sku', 'name', 'discogs_release_id', 'listing_location', 'bin_position', 'business_location_id']);
            \$out = \$rows->map(function (\$r) { \$loc = \Illuminate\Support\Facades\DB::table('business_locations')->where('id', \$r->business_location_id)->value('name'); return ['erp_product_id' => \$r->id, 'sku' => \$r->sku, 'name' => \$r->name, 'discogs_release_id' => \$r->discogs_release_id, 'listing_location' => \$r->listing_location, 'bin_position' => \$r->bin_position, 'business_location' => \$loc]; });
            echo "RESULT_JSON: " . \$out->toJson() . "\n";
            PHP
            echo "=== done ==="
