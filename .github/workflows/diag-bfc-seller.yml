# READ-ONLY: buy offers + store credit for a seller by name, plus recent BFC errors in the log.
name: Diag BFC seller

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Seller name fragment"
        required: true
        default: "morales"

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Inspect (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 120s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            N="${{ github.event.inputs.name }}"
            php artisan tinker --no-ansi <<PHP
            \$n = "$N";
            foreach (\App\Contact::where('name','like','%'.\$n.'%')->orWhere('first_name','like','%'.\$n.'%')->get() as \$c) {
              echo "CONTACT ".\$c->id." [".\$c->name."] type=".\$c->type." balance=".\$c->balance." mobile=".\$c->mobile." created=".\$c->created_at."\n";
            }
            foreach (\App\BuyCustomerOffer::where('seller_name','like','%'.\$n.'%')->orderBy('id','desc')->limit(20)->get() as \$o) {
              echo "OFFER ".\$o->id." ".\$o->buy_record_number." status=".\$o->status." seller=[".\$o->seller_name."] contact=".(\$o->contact_id ?? '-')." payout=".\$o->payout_type." pm=".\$o->payment_method." cash=".\$o->final_offer_cash." credit=".\$o->final_offer_credit." paid=".(\$o->final_amount_paid ?? '-')." by=".\$o->created_by." loc=".\$o->location_id." created=".\$o->created_at." updated=".\$o->updated_at." purchase=".(\$o->accepted_purchase_id ?? '-')."\n";
            }
            echo "--- sources ---\n";
            foreach (\DB::table('store_credit_logs')->select('source',\DB::raw('count(*) n'),\DB::raw('sum(amount) s'),\DB::raw('min(created_at) f'))->groupBy('source')->get() as \$r) echo json_encode(\$r)."\n";
            echo "--- andy (64) credit rows ---\n";
            foreach (\DB::table('store_credit_logs')->where('user_id',64)->orderBy('id')->get() as \$r) echo json_encode(\$r)."\n";
            echo "--- contacts with BOTH buy credit and a manual add within 3 days ---\n";
            \$bfc = \DB::table('store_credit_logs')->where('source','buy_from_customer')->get();
            foreach (\$bfc as \$b) {
              \$m = \DB::table('store_credit_logs')->where('contact_id',\$b->contact_id)->where('source','!=','buy_from_customer')->where('amount','>',0)
                 ->whereBetween('created_at',[date('Y-m-d H:i:s',strtotime(\$b->created_at)-3*86400), date('Y-m-d H:i:s',strtotime(\$b->created_at)+3*86400)])->get();
              foreach (\$m as \$x) {
                \$c = \App\Contact::find(\$b->contact_id);
                echo "C".\$b->contact_id." [".\$c->name."] bal=".\$c->balance." | BUY +".\$b->amount." ".\$b->created_at." (offer ".\$b->buy_customer_offer_id.", user ".\$b->user_id.") | ".\$x->source." +".\$x->amount." ".\$x->created_at." user ".\$x->user_id." reason=".\$x->reason."\n";
              }
            }
            echo "--- manual adds with reason collection/buy, any time ---\n";
            foreach (\DB::table('store_credit_logs')->where('source','!=','buy_from_customer')->where(function(\$q){\$q->where('reason','like','%ollection%')->orWhere('reason','like','%buy%')->orWhere('reason','like','%trade%');})->get() as \$r) echo json_encode(\$r)."\n";
            echo "--- user names ---\n";
            foreach (\App\User::whereIn('id', \DB::table('store_credit_logs')->pluck('user_id')->unique())->get() as \$u) echo \$u->id."=".\$u->first_name." ";
            echo "\n--- contacts with balance_notes mentioning Andy ---\n";
            foreach (\App\Contact::where('balance_notes','like','%by Andy%')->get() as \$c) echo "C".\$c->id." [".\$c->name."] bal=".\$c->balance."\n".\$c->balance_notes."\n";
            PHP
            echo "=== log ==="
            L=storage/logs/laravel-$(date +%Y-%m-%d).log; [ -f "$L" ] || L=storage/logs/laravel.log
            grep -n -i "buy-from-customer\|BuyFromCustomer\|bfc" "$L" | tail -40 | cut -c1-600
            echo "=== done ==="
