# READ-ONLY: buy offers + store credit for a seller by name, plus recent BFC errors in the log.
name: Diag BFC seller

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Seller name fragment"
        required: true
        default: "morales"

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Inspect (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            N="${{ github.event.inputs.name }}"
            php artisan tinker --no-ansi <<PHP
            \$n = "$N";
            foreach (\App\Contact::where('name','like','%'.\$n.'%')->orWhere('first_name','like','%'.\$n.'%')->get() as \$c) {
              echo "CONTACT ".\$c->id." [".\$c->name."] type=".\$c->type." balance=".\$c->balance." mobile=".\$c->mobile." created=".\$c->created_at."\n";
            }
            foreach (\App\BuyCustomerOffer::where('seller_name','like','%'.\$n.'%')->orderBy('id','desc')->limit(20)->get() as \$o) {
              echo "OFFER ".\$o->id." ".\$o->buy_record_number." status=".\$o->status." seller=[".\$o->seller_name."] contact=".(\$o->contact_id ?? '-')." payout=".\$o->payout_type." pm=".\$o->payment_method." cash=".\$o->final_offer_cash." credit=".\$o->final_offer_credit." paid=".(\$o->final_amount_paid ?? '-')." by=".\$o->created_by." loc=".\$o->location_id." created=".\$o->created_at." updated=".\$o->updated_at." purchase=".(\$o->accepted_purchase_id ?? '-')."\n";
            }
            echo "--- speed by bucket ---\n";
            \$sold = \DB::select("SELECT LEAST(FLOOR(sl.unit_price_inc_tax/10),10) b, DATEDIFF(t.transaction_date, COALESCE(p.listed_at,p.created_at)) d FROM transaction_sell_lines sl JOIN transactions t ON t.id=sl.transaction_id JOIN products p ON p.id=sl.product_id WHERE t.type='sell' AND t.status='final' AND t.business_id=1 AND t.transaction_date >= '2025-10-26' AND sl.unit_price_inc_tax >= 1 AND COALESCE(p.listed_at,p.created_at) >= '2024-02-01' AND COALESCE(p.listed_at,p.created_at) <= t.transaction_date");
            \$g=[]; foreach (\$sold as \$r) \$g[(int)\$r->b][]=(int)\$r->d;
            ksort(\$g);
            \$pc=function(\$a,\$p){ \$i=(int)floor((count(\$a)-1)*\$p); return \$a[\$i]; };
            foreach (\$g as \$b=>\$a) { sort(\$a); \$n=count(\$a); \$w30=count(array_filter(\$a,function(\$x){return \$x<=30;})); \$w90=count(array_filter(\$a,function(\$x){return \$x<=90;}));
              echo "sold \$".(\$b*10)."-".(\$b==10?'+':(\$b*10+10)).": n=\$n median=".\$pc(\$a,.5)." p75=".\$pc(\$a,.75)." p90=".\$pc(\$a,.9)." within30=".round(100*\$w30/\$n)."% within90=".round(100*\$w90/\$n)."%\n"; }
            \$st = \DB::select("SELECT LEAST(FLOOR(v.sell_price_inc_tax/10),10) b, SUM(vld.qty_available) q, SUM(CASE WHEN COALESCE(p.listed_at,p.created_at) < NOW() - INTERVAL 90 DAY THEN vld.qty_available ELSE 0 END) q90, SUM(CASE WHEN COALESCE(p.listed_at,p.created_at) < NOW() - INTERVAL 180 DAY THEN vld.qty_available ELSE 0 END) q180, SUM(vld.qty_available*GREATEST(v.default_purchase_price,0)) cost FROM variation_location_details vld JOIN variations v ON v.id=vld.variation_id JOIN products p ON p.id=v.product_id WHERE p.business_id=1 AND vld.qty_available>0 AND vld.location_id IN (1,2) AND v.sell_price_inc_tax>=1 GROUP BY b ORDER BY b");
            foreach (\$st as \$r) echo "stock \$".(\$r->b*10).": qty=".round(\$r->q)." >90d=".round(\$r->q90)." >180d=".round(\$r->q180)." cost=".round(\$r->cost)."\n";
            \$sp = \DB::select("SELECT LEAST(FLOOR(sl.unit_price_inc_tax/10),10) b, COUNT(*) n, SUM(sl.quantity) q FROM transaction_sell_lines sl JOIN transactions t ON t.id=sl.transaction_id WHERE t.type='sell' AND t.status='final' AND t.business_id=1 AND t.transaction_date >= NOW() - INTERVAL 90 DAY AND sl.unit_price_inc_tax>=1 GROUP BY b ORDER BY b");
            foreach (\$sp as \$r) echo "sold90d \$".(\$r->b*10).": qty=".round(\$r->q)."\n";
            \$mk = \DB::select("SELECT ROUND(AVG(CASE WHEN v.default_purchase_price>0 AND v.default_purchase_price < v.sell_price_inc_tax THEN v.default_purchase_price/v.sell_price_inc_tax END)*100) costpct, LEAST(FLOOR(v.sell_price_inc_tax/10),10) b FROM variation_location_details vld JOIN variations v ON v.id=vld.variation_id WHERE vld.qty_available>0 AND v.sell_price_inc_tax>=1 GROUP BY b ORDER BY b");
            foreach (\$mk as \$r) echo "cost% \$".(\$r->b*10).": ".\$r->costpct."\n";
            PHP
            echo "=== log ==="
            L=storage/logs/laravel-$(date +%Y-%m-%d).log; [ -f "$L" ] || L=storage/logs/laravel.log
            grep -n -i "buy-from-customer\|BuyFromCustomer\|bfc" "$L" | tail -40 | cut -c1-600
            echo "=== done ==="
