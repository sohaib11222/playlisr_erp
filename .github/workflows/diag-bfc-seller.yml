# READ-ONLY: buy offers + store credit for a seller by name, plus recent BFC errors in the log.
name: Diag BFC seller

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Seller name fragment"
        required: true
        default: "morales"

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Inspect (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 120s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            N="${{ github.event.inputs.name }}"
            php artisan tinker --no-ansi <<PHP
            \$n = "$N";
            foreach (\App\Contact::where('name','like','%'.\$n.'%')->orWhere('first_name','like','%'.\$n.'%')->get() as \$c) {
              echo "CONTACT ".\$c->id." [".\$c->name."] type=".\$c->type." balance=".\$c->balance." mobile=".\$c->mobile." created=".\$c->created_at."\n";
            }
            foreach (\App\BuyCustomerOffer::where('seller_name','like','%'.\$n.'%')->orderBy('id','desc')->limit(20)->get() as \$o) {
              echo "OFFER ".\$o->id." ".\$o->buy_record_number." status=".\$o->status." seller=[".\$o->seller_name."] contact=".(\$o->contact_id ?? '-')." payout=".\$o->payout_type." pm=".\$o->payment_method." cash=".\$o->final_offer_cash." credit=".\$o->final_offer_credit." paid=".(\$o->final_amount_paid ?? '-')." by=".\$o->created_by." loc=".\$o->location_id." created=".\$o->created_at." updated=".\$o->updated_at." purchase=".(\$o->accepted_purchase_id ?? '-')."\n";
            }
            echo "--- age data ---\n";
            \$q = "SELECT p.id, p.created_at, v.default_purchase_price cost, v.sell_price_inc_tax price, (SELECT MIN(t.transaction_date) FROM purchase_lines pl JOIN transactions t ON t.id=pl.transaction_id WHERE pl.variation_id=v.id AND t.type IN ('purchase','opening_stock')) first_buy, (SELECT SUM(qty_available) FROM variation_location_details vld WHERE vld.variation_id=v.id) qty FROM products p JOIN variations v ON v.product_id=p.id AND v.deleted_at IS NULL WHERE p.business_id=1 HAVING qty>0";
            \$rows = \DB::select(\$q); echo "instock variations=".count(\$rows)."\n";
            \$b=[]; \$fb=[]; \$nocost=0; \$costgtprice=0; \$diff=0;
            foreach (\$rows as \$r) { \$d = \$r->created_at; \$y=substr(\$d,0,7); \$b[\$y]=(\$b[\$y]??0)+1; \$f = \$r->first_buy ? substr(\$r->first_buy,0,10) : 'none'; if (\$f==='none' || \$f < '2024-02-01') \$fb[\$f]=(\$fb[\$f]??0)+1; if ((float)\$r->cost<=0) \$nocost++; if ((float)\$r->cost>(float)\$r->price) \$costgtprice++; if (\$r->first_buy && abs(strtotime(\$r->first_buy)-strtotime(\$r->created_at))>86400*7) \$diff++; }
            ksort(\$b); echo "created by month: ".json_encode(\$b)."\n"; arsort(\$fb); echo "old/none first_buy: ".json_encode(array_slice(\$fb,0,10))."\n";
            echo "nocost=\$nocost cost>price=\$costgtprice created_vs_firstbuy_differ_7d=\$diff\n";
            echo "locations: ".json_encode(\DB::table('business_locations')->where('business_id',1)->get(['id','name','location_id']))."\n";
            echo "barcodes: ".json_encode(\DB::table('barcodes')->get(['id','name','width','height','is_default','stickers_in_one_row']))."\n";
            PHP
            echo "=== log ==="
            L=storage/logs/laravel-$(date +%Y-%m-%d).log; [ -f "$L" ] || L=storage/logs/laravel.log
            grep -n -i "buy-from-customer\|BuyFromCustomer\|bfc" "$L" | tail -40 | cut -c1-600
            echo "=== done ==="
