# Read-only: maps phone exchanges (NPA-NXX -> phone-company rate center, from localcallingguide.com)
# to LA neighborhoods; compares event-RSVP contacts vs named, paying shoppers. Counts only, no names/numbers.
name: Diag customer neighborhoods

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Run on prod
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/k && chmod 600 /tmp/k
          O="-o StrictHostKeyChecking=no"
          scp -i /tmp/k -P ${{ steps.flags.outputs.ssh_port }} $O .github/diag-data/la-phone-exchange-lut.b64 "$DEPLOY_USER@$DEPLOY_HOST:/tmp/hood_lut.b64"
          ssh -i /tmp/k -p ${{ steps.flags.outputs.ssh_port }} $O "$DEPLOY_USER@$DEPLOY_HOST" "echo '' | base64 -d > /tmp/hood.php && cd /www/playlist.nivessa.com/app && php artisan tinker /tmp/hood.php 2>&1; rm -f /tmp/hood.php /tmp/hood_lut.b64"
          rm -f /tmp/k
