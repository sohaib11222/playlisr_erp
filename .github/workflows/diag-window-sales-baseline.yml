# READ-ONLY diagnostic: compare the Beabadoobee party's 6-8 PM HW sales
# against 6-8 PM sales on recent NON-party days at HW, to see whether
# $1196.50 is unusually high or just normal evening traffic. Also breaks the
# window's sales into preorder vs non-preorder product_type. One-off; delete
# after use.
name: Diag window sales baseline

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Compare window sales vs baseline (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 60s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            $businessId = \DB::table('business')->value('id');
            $hwId = \DB::table('business_locations')->where('business_id', $businessId)->where('name', 'like', '%hollywood%')->value('id');
            echo "HW location id: " . $hwId . "\n";
            $net = '(tsl.quantity - COALESCE(tsl.quantity_returned, 0)) * (tsl.unit_price_inc_tax - COALESCE(tsl.item_tax, 0))';

            // Party night itself
            $dates = ['2026-09-12','2026-09-05','2026-08-29','2026-08-22','2026-08-15','2026-08-08'];
            foreach ($dates as $d) {
                $sales = \DB::table('transactions as t')
                    ->join('transaction_sell_lines as tsl', 'tsl.transaction_id', '=', 't.id')
                    ->where('t.business_id', $businessId)->where('t.location_id', $hwId)
                    ->where('t.type', 'sell')->where('t.status', 'final')->whereNull('t.import_source')
                    ->where(function ($q) { $q->where('t.is_whatnot', 0)->orWhereNull('t.is_whatnot'); })
                    ->whereBetween('t.transaction_date', [$d . ' 18:00:00', $d . ' 20:00:59'])
                    ->sum(\DB::raw($net));
                $dow = \Carbon::parse($d)->format('D');
                echo $d . " (" . $dow . ") 6-8pm HW sales: $" . round($sales, 2) . "\n";
            }

            // Breakdown of the party night's items by product name, to see if it's driven by the featured release or general stock
            echo "--- 2026-09-12 6-8pm HW line items (top 20 by revenue) ---\n";
            $lines = \DB::table('transactions as t')
                ->join('transaction_sell_lines as tsl', 'tsl.transaction_id', '=', 't.id')
                ->join('products as p', 'tsl.product_id', '=', 'p.id')
                ->where('t.business_id', $businessId)->where('t.location_id', $hwId)
                ->where('t.type', 'sell')->where('t.status', 'final')->whereNull('t.import_source')
                ->whereBetween('t.transaction_date', ['2026-09-12 18:00:00', '2026-09-12 20:00:59'])
                ->selectRaw('p.name, tsl.quantity, tsl.unit_price_inc_tax, t.transaction_date')
                ->orderByRaw('tsl.quantity * tsl.unit_price_inc_tax desc')
                ->limit(20)
                ->get();
            foreach ($lines as $l) {
                echo "  " . substr($l->transaction_date, 11, 5) . " x" . $l->quantity . " " . $l->name . " @ $" . $l->unit_price_inc_tax . "\n";
            }
            PHP
            echo "=== done ==="
