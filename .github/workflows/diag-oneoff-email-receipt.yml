# One-off diagnostic — tail the Laravel log for the emailReceipt failure
# (POST /pos/{id}/email-receipt). Delete after use.
name: Diag oneoff email receipt

on:
  workflow_dispatch:

concurrency:
  group: production-restart
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Tail log for emailReceipt
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 60s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app

            echo "=== latest log file ==="
            LOG="$(ls -t storage/logs/laravel-*.log 2>/dev/null | head -1)"
            echo "latest log: $LOG"
            echo

            echo "=== last 60 lines matching emailReceipt / ERP bridge ==="
            grep -n "emailReceipt\|erp/receipts/email\|website base/key" "$LOG" 2>&1 | tail -60
            echo

            echo "=== ERP_API_KEY / NIVESSA_API resolution (config, cache-aware) ==="
            php artisan tinker --execute="echo 'config.nivessa_api=' . config('constants.nivessa_api') . PHP_EOL; echo 'config.erp_api_key_len=' . strlen((string) config('constants.erp_api_key')) . PHP_EOL; echo 'env.NIVESSA_API=' . env('NIVESSA_API') . PHP_EOL; echo 'env.ERP_API_KEY_len=' . strlen((string) env('ERP_API_KEY')) . PHP_EOL;" 2>&1
            echo

            echo "=== tail raw stack trace around last emailReceipt failure ==="
            LINE=$(grep -n "emailReceipt failed\|website base/key not configured\|emailReceipt push failed" "$LOG" | tail -1 | cut -d: -f1)
            if [ -n "$LINE" ]; then
              sed -n "$((LINE>15?LINE-15:1)),$((LINE+15))p" "$LOG"
            else
              echo "(no matching line found)"
            fi
