# READ-ONLY diagnostic: `php artisan migrate --force` just reported "Nothing
# to migrate" for the new receiving_* tables even though this is their first
# deploy. Confirm via migrate:status + a raw DB table check whether they
# actually exist, rather than trusting that one ambiguous line. No writes.
name: Diag receiving migrate status

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: migrate:status + table check (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app

            echo "=== migration files on disk ==="
            ls -la database/migrations/ | grep receiving

            echo "=== php artisan migrate:status (filtered) ==="
            php artisan migrate:status 2>&1 | grep -i receiving || echo "NO MATCH in migrate:status output"

            echo "=== php artisan migrate:status (full tail, for context) ==="
            php artisan migrate:status 2>&1 | tail -15

            echo "=== raw DB table check via tinker ==="
            php artisan tinker --execute="foreach (['receiving_packages','receiving_items','receiving_package_purchase_orders'] as \$t) { echo \$t . ': ' . (Illuminate\Support\Facades\Schema::hasTable(\$t) ? 'EXISTS' : 'MISSING') . PHP_EOL; }" 2>&1

            echo "=== done ==="
