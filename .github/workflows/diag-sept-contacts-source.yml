# Read-only: where September 2026 customer contacts came from. Aggregates only.
name: Diag Sept contacts source

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          script: |
            echo '' | base64 -d > /tmp/sept_src.php
            cd /www/playlist.nivessa.com/app && php artisan tinker /tmp/sept_src.php 2>&1
            rm -f /tmp/sept_src.php
