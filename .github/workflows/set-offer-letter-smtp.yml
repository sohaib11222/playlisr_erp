# One-click, one-time setup: writes OFFER_MAIL_* into the ERP's production
# .env — a SEPARATE, dedicated SMTP mailbox used only by the cashier
# offer-letter sender (app/Services/OfferLetterMailer.php), so offer letters
# come from sarah@nivessa.com specifically while everything else keeps using
# the app's default mailer (hello@nivessa.com, set via set-mail-smtp.yml).
#
# Same safe pattern as set-nivessa-web-token.yml / set-mail-smtp.yml:
#   - credential values come from real GitHub secrets (masked in logs),
#     never typed into a workflow_dispatch input or seen by Claude
#   - additive only — skips a key if it's already set, never overwrites
#   - verifies .env still parses and the site is still up afterward
#
# Setup (one time, in the GitHub repo's Settings > Secrets and variables >
# Actions), before running this workflow:
#   OFFER_MAIL_HOST       e.g. smtp.gmail.com
#   OFFER_MAIL_PORT       e.g. 587
#   OFFER_MAIL_ENCRYPTION e.g. tls
#   OFFER_MAIL_USERNAME   sarah@nivessa.com
#   OFFER_MAIL_PASSWORD   a Google Workspace App Password for sarah@nivessa.com
#                         (Google Account > Security > App Passwords — needs
#                         2-Step Verification turned on first)
#
# Uses the same SSH secrets as Deploy production: DEPLOY_HOST, DEPLOY_USER,
# DEPLOY_SSH_KEY, (optional DEPLOY_PORT).

name: Set offer-letter SMTP credentials

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  set-offer-smtp:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Fail fast if any secret is missing
        env:
          OFFER_MAIL_HOST: ${{ secrets.OFFER_MAIL_HOST }}
          OFFER_MAIL_PORT: ${{ secrets.OFFER_MAIL_PORT }}
          OFFER_MAIL_ENCRYPTION: ${{ secrets.OFFER_MAIL_ENCRYPTION }}
          OFFER_MAIL_USERNAME: ${{ secrets.OFFER_MAIL_USERNAME }}
          OFFER_MAIL_PASSWORD: ${{ secrets.OFFER_MAIL_PASSWORD }}
        run: |
          missing=""
          [ -z "$OFFER_MAIL_HOST" ] && missing="$missing OFFER_MAIL_HOST"
          [ -z "$OFFER_MAIL_PORT" ] && missing="$missing OFFER_MAIL_PORT"
          [ -z "$OFFER_MAIL_ENCRYPTION" ] && missing="$missing OFFER_MAIL_ENCRYPTION"
          [ -z "$OFFER_MAIL_USERNAME" ] && missing="$missing OFFER_MAIL_USERNAME"
          [ -z "$OFFER_MAIL_PASSWORD" ] && missing="$missing OFFER_MAIL_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing repo secret(s):$missing — add them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - name: Write offer-letter SMTP credentials on server (additive, skips if already set)
        uses: appleboy/ssh-action@v1.2.0
        env:
          OFFER_MAIL_HOST: ${{ secrets.OFFER_MAIL_HOST }}
          OFFER_MAIL_PORT: ${{ secrets.OFFER_MAIL_PORT }}
          OFFER_MAIL_ENCRYPTION: ${{ secrets.OFFER_MAIL_ENCRYPTION }}
          OFFER_MAIL_USERNAME: ${{ secrets.OFFER_MAIL_USERNAME }}
          OFFER_MAIL_PASSWORD: ${{ secrets.OFFER_MAIL_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 60s
          envs: OFFER_MAIL_HOST,OFFER_MAIL_PORT,OFFER_MAIL_ENCRYPTION,OFFER_MAIL_USERNAME,OFFER_MAIL_PASSWORD
          script: |
            set +e
            echo "=== connected, starting ==="
            DEPLOY_DIR="/www/playlist.nivessa.com/app"
            cd "$DEPLOY_DIR" || { echo "Cannot cd to $DEPLOY_DIR"; exit 1; }
            echo "=== in $DEPLOY_DIR ==="

            set_kv_once() {
              key="$1"; val="$2"
              if grep -q "^${key}=" .env; then
                echo "$key already set, skipping"
              else
                printf '\n%s=%s\n' "$key" "$val" >> .env
                echo "$key set"
              fi
            }

            set_kv_once OFFER_MAIL_HOST "$OFFER_MAIL_HOST"
            set_kv_once OFFER_MAIL_PORT "$OFFER_MAIL_PORT"
            set_kv_once OFFER_MAIL_ENCRYPTION "$OFFER_MAIL_ENCRYPTION"
            set_kv_once OFFER_MAIL_USERNAME "$OFFER_MAIL_USERNAME"
            set_kv_once OFFER_MAIL_PASSWORD "$OFFER_MAIL_PASSWORD"

            echo "=== verifying .env still parses ==="
            php -r '$e = parse_ini_file(".env"); var_dump($e !== false);'

            echo "=== recycling php-fpm workers so env reloads ==="
            ME=$(whoami)
            pkill -9 -u "$ME" -f 'php-?fpm.*pool' 2>&1 || true
            sleep 3

            echo "=== site still up? ==="
            curl -s -o /dev/null -w "https://playlist.nivessa.com -> %{http_code}\n" https://playlist.nivessa.com/login
