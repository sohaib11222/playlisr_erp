# READ-ONLY diagnostic: pull LIVE Sling shifts (SlingClient, not the synced
# sling_shifts table) for the 4 confirmed party dates, filter to floor
# positions (Cashier/Event Lead/Floor Sales) overlapping each party's
# window, and print who that would include per store - to check against
# known ground truth before changing the estimate logic. Mirrors
# SyncSlingShifts's exact field-parsing (location/position are id refs,
# resolved via groups()). One-off; delete after use.
name: Diag live sling test

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Test live Sling API against known cases (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            $client = app(\App\Services\SlingClient::class);
            echo "configured: " . ($client->isConfigured() ? 'yes' : 'NO') . "\n";

            $locationNameById = [];
            $positionNameById = [];
            foreach ($client->groups() as $g) {
                $gid = (string) ($g['id'] ?? '');
                if ($gid === '') { continue; }
                $gname = trim((string) ($g['name'] ?? ''));
                if ($gname === '') { continue; }
                $gtype = strtolower(trim((string) ($g['type'] ?? '')));
                if ($gtype === 'location') { $locationNameById[$gid] = $gname; }
                elseif ($gtype === 'position') { $positionNameById[$gid] = $gname; }
            }
            echo "locations: " . implode(', ', $locationNameById) . "\n";

            $nameById = [];
            foreach ($client->users() as $u) {
                $sid = (string) ($u['id'] ?? '');
                if ($sid === '') { continue; }
                $first = trim((string) ($u['legalName'] ?? $u['firstName'] ?? ''));
                $last = trim((string) ($u['lastName'] ?? ''));
                $name = trim($first . ' ' . $last) ?: (string) ($u['name'] ?? '');
                if ($name !== '') { $nameById[$sid] = $name; }
            }

            $dates = ['2026-09-12', '2026-09-13', '2026-09-15', '2026-09-18'];
            $floorPos = ['cashier', 'event lead', 'floor sales'];

            foreach ($dates as $d) {
                echo "=== " . $d . " ===\n";
                $shifts = $client->shifts($d, $d);
                echo "  raw shift count: " . count($shifts) . "\n";
                foreach ($shifts as $s) {
                    if (\App\Services\SlingClient::isTimeOff($s)) { continue; }
                    $sid = (string) ($s['user']['id'] ?? ($s['userId'] ?? ''));
                    $name = $nameById[$sid] ?? 'unknown';
                    $locId = (string) ($s['location']['id'] ?? '');
                    $loc = strtolower($s['location']['name'] ?? ($locId !== '' ? ($locationNameById[$locId] ?? '') : ''));
                    $posId = (string) ($s['position']['id'] ?? '');
                    $pos = strtolower($s['position']['name'] ?? ($posId !== '' ? ($positionNameById[$posId] ?? '') : ''));
                    $start = $s['dtstart'] ?? $s['startDate'] ?? '?';
                    $end = $s['dtend'] ?? $s['endDate'] ?? '?';
                    $isFloor = false;
                    foreach ($floorPos as $fp) { if (strpos($pos, $fp) !== false) { $isFloor = true; break; } }
                    if (!$isFloor) { continue; }
                    echo "  " . $name . " | " . $pos . " | " . $loc . " | " . $start . " to " . $end . "\n";
                }
            }
            PHP
            echo "=== done ==="
