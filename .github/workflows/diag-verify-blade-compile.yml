# READ-ONLY: compiles a given list of .blade.php files against the live
# server's actual blade.compiler + runs php -l on the output, exactly like
# diag-tasks-edit-blade-syntax.yml did for the earlier "unexpected endif"
# incident. Reusable — edit $files below before dispatching to check
# whatever views just changed.
name: Diag verify blade compile

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Compile + php -l each file (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            function tryCompile($label, $src) { try { $compiled = app('blade.compiler')->compileString($src); $tmp = tempnam(sys_get_temp_dir(), 'blade_test_') . '.php'; file_put_contents($tmp, $compiled); $out = []; $ret = 0; exec('php -l ' . escapeshellarg($tmp) . ' 2>&1', $out, $ret); echo "[$label] php -l exit=$ret : " . implode(' | ', $out) . "\n"; unlink($tmp); } catch (\Throwable $e) { echo "[$label] COMPILE THREW: " . $e->getMessage() . "\n"; } }
            $files = ['tasks/index.blade.php', 'tasks/edit.blade.php', 'tasks/partials/form_fields.blade.php', 'tasks/partials/status_dropdown.blade.php', 'tasks/partials/due_today_bubble.blade.php', 'tasks/start_shift.blade.php', 'tasks/end_shift.blade.php'];
            foreach ($files as $f) { $p = resource_path('views/' . $f); if (!file_exists($p)) { echo "[$f] FILE NOT FOUND\n"; continue; } tryCompile($f, file_get_contents($p)); }
            PHP
            echo "=== done ==="
