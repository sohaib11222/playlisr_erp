# READ-ONLY diagnostic: confirm the production checkout is up to date and
# spot-check specific BFC storage-locations features actually work server
# side (schema columns, routes, live data). No writes.
name: Diag verify server files

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Check server HEAD + processing-status feature (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            echo "=== server git HEAD ==="
            git rev-parse HEAD
            git log -1 --format='%h %s'
            echo "=== route registered? ==="
            php artisan route:list --no-ansi 2>/dev/null | grep -i "processing-status"
            echo "=== controller: updateProcessingStatus present? ==="
            grep -n "function updateProcessingStatus" app/Http/Controllers/BuyFromCustomerController.php
            echo "=== view: status dropdown present? ==="
            grep -n "bfc-status-select\|processing_status" resources/views/buy_from_customer/storage_locations.blade.php
            echo "=== DB columns + sample data (read-only tinker) ==="
            php artisan tinker --no-ansi <<'PHP'
            echo "has_processing_status=".(\Illuminate\Support\Facades\Schema::hasColumn('buy_customer_offers','processing_status') ? 'yes' : 'no')."\n";
            echo "has_updated_by=".(\Illuminate\Support\Facades\Schema::hasColumn('buy_customer_offers','processing_status_updated_by') ? 'yes' : 'no')."\n";
            echo "has_updated_at=".(\Illuminate\Support\Facades\Schema::hasColumn('buy_customer_offers','processing_status_updated_at') ? 'yes' : 'no')."\n";
            $counts = \App\BuyCustomerOffer::where('status','accepted')->selectRaw('processing_status, count(*) as c')->groupBy('processing_status')->pluck('c','processing_status');
            echo "status distribution: ".json_encode($counts)."\n";
            $sample = \App\BuyCustomerOffer::where('status','accepted')->latest('accepted_at')->first();
            echo "sample offer id=".$sample->id." processing_status=".($sample->processing_status ?? 'NULL')." updated_by=".($sample->processing_status_updated_by ?? 'NULL')."\n";
            PHP
            echo "=== done ==="
