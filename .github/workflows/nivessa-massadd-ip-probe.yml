# Read-only diagnostic: who/what is creating Mass Add products under the
# Insha account (user id 44). Pulls (a) the client IPs behind POST
# /product/mass-store from nginx access logs, and (b) the opening-stock
# transaction creators for those products (session user.id, which differs
# from product.created_by under "Sign in as user" impersonation).
# No writes — pure reads. Reuses the Deploy production SSH secrets.

name: Nivessa · mass-add IP probe

on:
  workflow_dispatch:
    inputs:
      days:
        description: Look back this many days
        required: true
        default: '10'

concurrency:
  group: nivessa-massadd-ip-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Run probe over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 180s
          script: |
            echo "=== nginx access logs present ==="
            ls -la /www/wwwlogs/ 2>/dev/null | grep -i playlist || ls -la /www/wwwlogs/ 2>/dev/null | head -30 || echo "no /www/wwwlogs"
            echo
            echo "=== POST /product/mass-store hits (IP + time + status), recent ==="
            for f in /www/wwwlogs/*playlist*.log /www/wwwlogs/access*.log /www/wwwlogs/*.log; do
              [ -f "$f" ] || continue
              hits=$(grep -c "product/mass-store" "$f" 2>/dev/null || echo 0)
              [ "$hits" = "0" ] && continue
              echo "--- $f ($hits hits) ---"
              grep "product/mass-store" "$f" 2>/dev/null | awk '{print $1, $4, $5, $6, $7, $9}' | tail -60
            done
            echo
            echo "=== rotated/gz logs ==="
            for f in /www/wwwlogs/*playlist*.log.gz /www/wwwlogs/*.log.*.gz; do
              [ -f "$f" ] || continue
              h=$(zcat "$f" 2>/dev/null | grep -c "product/mass-store")
              [ "$h" = "0" ] && continue
              echo "--- $f ($h hits) ---"
              zcat "$f" 2>/dev/null | grep "product/mass-store" | awk '{print $1, $4, $5, $6, $7, $9}' | tail -40
            done
            echo
            echo "=== DB: opening-stock creators behind user-44 mass_add products (last ${{ github.event.inputs.days }}d) ==="
            echo '' | base64 -d > /tmp/massadd_probe.php
            cd /www/playlist.nivessa.com/app && PROBE_DAYS='${{ github.event.inputs.days }}' php artisan tinker /tmp/massadd_probe.php
            rm -f /tmp/massadd_probe.php
