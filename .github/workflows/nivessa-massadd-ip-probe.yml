# Read-only diagnostic: who/what is creating Mass Add products under the
# Insha account (user id 44). Pulls (a) the client IPs behind POST
# /product/mass-store from nginx access logs, and (b) the opening-stock
# transaction creators for those products (session user.id, which differs
# from product.created_by under "Sign in as user" impersonation).
# No writes — pure reads. Reuses the Deploy production SSH secrets.

name: Nivessa · mass-add IP probe

on:
  workflow_dispatch:
    inputs:
      days:
        description: Look back this many days
        required: true
        default: '10'

concurrency:
  group: nivessa-massadd-ip-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for i in 1 2 3 4 5 6; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null \
               && [ -s ~/.ssh/known_hosts ]; then
              echo "keyscan ok on attempt $i"; exit 0
            fi
            echo "keyscan attempt $i failed; retrying"; sleep 10
          done
          echo "keyscan failed after retries"; exit 1

      - name: Run probe over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 180s
          script: |
            echo "=== candidate access-log dirs ==="
            for d in /www/wwwlogs /www/server/nginx/logs /usr/local/nginx/logs /var/log/nginx /usr/local/lsws/logs /var/log/apache2 /www/server/panel/logs; do
              [ -d "$d" ] && echo "DIR $d:" && ls -la "$d" 2>/dev/null | head -20
            done
            echo
            echo "=== plain .log files containing mass-store ==="
            CAND=$(find /www/wwwlogs /www/server/nginx/logs /usr/local/nginx/logs /var/log/nginx /usr/local/lsws/logs /var/log/apache2 -maxdepth 2 -type f 2>/dev/null | grep -iE '\.log$|access' )
            for f in $CAND; do
              h=$(grep -c "product/mass-store" "$f" 2>/dev/null || echo 0)
              [ "$h" = "0" ] && continue
              echo "--- $f ($h hits) ---"
              grep "product/mass-store" "$f" 2>/dev/null | tail -50
            done
            echo
            echo "=== gz logs containing mass-store ==="
            for f in $(find /www/wwwlogs /www/server/nginx/logs /usr/local/nginx/logs /var/log/nginx -maxdepth 2 -name '*.gz' 2>/dev/null); do
              h=$(zcat "$f" 2>/dev/null | grep -c "product/mass-store")
              [ "$h" = "0" ] && continue
              echo "--- $f ($h hits) ---"
              zcat "$f" 2>/dev/null | grep "product/mass-store" | tail -40
            done
            echo
            echo "=== DB: opening-stock creators behind user-44 mass_add products (last ${{ github.event.inputs.days }}d) ==="
            echo '' | base64 -d > /tmp/massadd_probe.php
            cd /www/playlist.nivessa.com/app && PROBE_DAYS='${{ github.event.inputs.days }}' php artisan tinker /tmp/massadd_probe.php
            rm -f /tmp/massadd_probe.php
