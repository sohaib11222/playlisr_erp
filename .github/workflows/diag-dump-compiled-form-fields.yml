# READ-ONLY diagnostic: dumps the actual compiled PHP (with line numbers)
# that Blade produces from resources/views/tasks/partials/form_fields.blade.php
# on the server right now, focused around the line the parser chokes on
# (see diag-tasks-edit-blade-syntax.yml, which found php -l failing at
# compiled line 86). No writes.
name: Diag dump compiled form_fields

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Dump compiled PHP with line numbers (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            function tryCompile($label, $src) {
                try {
                    $compiled = app('blade.compiler')->compileString($src);
                    $tmp = tempnam(sys_get_temp_dir(), 'blade_test_') . '.php';
                    file_put_contents($tmp, $compiled);
                    $out = [];
                    $ret = 0;
                    exec('php -l ' . escapeshellarg($tmp) . ' 2>&1', $out, $ret);
                    echo "[$label] php -l exit=$ret : " . implode(' | ', $out) . "\n";
                    unlink($tmp);
                } catch (\Throwable $e) {
                    echo "[$label] COMPILE THREW: " . $e->getMessage() . "\n";
                }
            }

            $path = resource_path('views/tasks/partials/form_fields.blade.php');
            $lines = file($path);
            $block = implode('', array_slice($lines, 35, 87 - 35)); // index 35..86 = lines 36-87, known to pass alone

            // Narrow down which sub-range of lines 1-35 is actually needed
            // alongside the block to reproduce the failure.
            $ranges = [
                'L1only'   => [0, 1],
                'L1-12'    => [0, 12],
                'L13-22'   => [12, 10],
                'L1-22'    => [0, 22],
                'L23-29'   => [22, 7],
                'L1-29'    => [0, 29],
                'L30-35'   => [29, 6],
                'L1-35'    => [0, 35],
            ];
            foreach ($ranges as $label => [$offset, $len]) {
                $prefix = implode('', array_slice($lines, $offset, $len));
                tryCompile($label, $prefix . $block);
            }
            PHP
            echo "=== done ==="
