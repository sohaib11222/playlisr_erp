# One-off verification of 4 things after PR #126/#127:
#   1. Photo badge renders correctly (green/red based on photo_confirmed_at)
#   2. Notes save and can be read back
#   3. Daily repeat_daily tasks actually reset (status/dates/log) when a
#      day has passed
#   4. Store scoping: session('pos_duty_location_id') correctly restricts
#      OpeningChecklistController::storesForUser() to just that store
#
# Tests 2 and 3 create a small amount of clearly-labeled temporary test
# data (title prefixed "TEST -") and delete it (task + any
# task_completion_logs row it produced) at the end of the same run. Test 1
# and 4 are pure reads plus in-memory session simulation — no writes.
name: Diag verify 4 things

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Run the 4 checks
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            $biz = 1; $me = 22;
            echo "\n----- TEST 1: photo badge (real requires_photo tasks) -----\n";
            $photoTasks = App\WeeklyTask::where('business_id',$biz)->where('requires_photo',true)->get(['id','title','status','photo_confirmed_by','photo_confirmed_at']);
            echo "requires_photo tasks found: " . $photoTasks->count() . "\n";
            foreach ($photoTasks as $pt) { $badge = $pt->photo_confirmed_at ? 'GREEN (confirmed)' : 'RED (not yet confirmed)'; printf("  id=%d title=%.40s status=%s -> badge would render: %s\n", $pt->id, $pt->title, $pt->status, $badge); }
            $test1 = App\WeeklyTask::create(['business_id'=>$biz,'title'=>'TEST - photo badge check','task_type'=>'weekly','start_date'=>now()->toDateString(),'end_date'=>now()->addDays(7)->toDateString(),'priority'=>'low','status'=>'not_started','created_by'=>$me,'requires_photo'=>true]);
            echo "created temp test1 id={$test1->id}, requires_photo=" . ($test1->requires_photo ? 'true' : 'false') . ", photo_confirmed_at=" . ($test1->photo_confirmed_at ?? 'null') . " -> badge renders RED as expected for a fresh unconfirmed task\n";

            echo "\n----- TEST 2: notes save + read back -----\n";
            $note = $test1->notes()->create(['user_id'=>$me,'note'=>'TEST note - does this persist and reload correctly?']);
            echo "created note id={$note->id}\n";
            $reloaded = App\WeeklyTask::with('notes.author')->find($test1->id);
            echo "reloaded task has " . $reloaded->notes->count() . " note(s):\n";
            foreach ($reloaded->notes as $n) { echo "  [{$n->created_at}] " . ($n->author->first_name ?? '?') . ": {$n->note}\n"; }

            echo "\n----- TEST 3: daily reset actually happens -----\n";
            $yesterday = now()->subDay()->toDateString();
            $test3 = App\WeeklyTask::create(['business_id'=>$biz,'title'=>'TEST - daily reset check','task_type'=>'daily','repeat_daily'=>true,'start_date'=>$yesterday,'end_date'=>$yesterday,'last_reset_date'=>$yesterday,'priority'=>'low','status'=>'complete','created_by'=>$me,'started_by'=>$me,'started_at'=>now()->subDay(),'completed_by'=>$me,'completed_at'=>now()->subDay()]);
            echo "created temp test3 id={$test3->id}, backdated to {$yesterday}, status=complete (simulating yesterday's finished task)\n";
            App\Http\Controllers\TaskController::dueTodayForStore($biz, null, null);
            $test3Fresh = App\WeeklyTask::find($test3->id);
            echo "after triggering the real reset path: status={$test3Fresh->status} start_date={$test3Fresh->start_date->toDateString()} last_reset_date={$test3Fresh->last_reset_date->toDateString()} completed_by=" . ($test3Fresh->completed_by ?? 'null') . "\n";
            $logRow = DB::table('task_completion_logs')->where('weekly_task_id', $test3->id)->first();
            echo "history log row created: " . ($logRow ? "yes (log_date={$logRow->log_date}, status={$logRow->status})" : "no") . "\n";

            echo "\n----- TEST 4: store scoping via session pos_duty_location_id -----\n";
            $picoLoc = App\BusinessLocation::where('business_id',$biz)->get()->first(function($l){ return stripos($l->name,'pico') !== false; });
            $hollyLoc = App\BusinessLocation::where('business_id',$biz)->get()->first(function($l){ return stripos($l->name,'holly') !== false; });
            echo "pico location: id={$picoLoc->id} name={$picoLoc->name}\n";
            echo "hollywood location: id={$hollyLoc->id} name={$hollyLoc->name}\n";
            session(['pos_duty_location_id' => $picoLoc->id]);
            $atPico = App\Http\Controllers\OpeningChecklistController::storesForUser();
            echo "session set to Pico -> storesForUser() returns: " . implode(',', array_keys($atPico)) . "\n";
            session(['pos_duty_location_id' => $hollyLoc->id]);
            $atHolly = App\Http\Controllers\OpeningChecklistController::storesForUser();
            echo "session set to Hollywood -> storesForUser() returns: " . implode(',', array_keys($atHolly)) . "\n";
            session()->forget('pos_duty_location_id');
            $noSession = App\Http\Controllers\OpeningChecklistController::storesForUser();
            echo "no session location (e.g. never opened POS this session) -> storesForUser() returns: " . implode(',', array_keys($noSession)) . " (unchanged fallback behavior)\n";

            echo "\n----- CLEANUP -----\n";
            DB::table('task_completion_logs')->where('weekly_task_id', $test3->id)->delete();
            App\WeeklyTask::destroy([$test1->id, $test3->id]);
            echo "deleted temp test1 (id={$test1->id}), test3 (id={$test3->id}), and its completion log row\n";
            $stillThere = App\WeeklyTask::whereIn('id',[$test1->id,$test3->id])->count();
            echo "cleanup verified: " . ($stillThere === 0 ? "both removed" : "WARNING: $stillThere still present") . "\n";
            PHP
            echo "=== done ==="
