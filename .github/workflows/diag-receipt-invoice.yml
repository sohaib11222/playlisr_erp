# READ-ONLY diagnostic: dump a sale by invoice/receipt number — transaction
# totals, sell lines (incl. returns, line discounts, tax), payments, and any
# return transactions — to explain receipt math that doesn't add up. No writes.
name: Diag receipt invoice

on:
  workflow_dispatch:
    inputs:
      invoice_no:
        description: "Receipt / invoice number, e.g. 35045"
        required: true

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if grep -q . ~/.ssh/known_hosts 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 0

      - name: Dump sale by invoice number (read-only)
        uses: appleboy/ssh-action@v1.2.0
        env:
          DIAG_INVOICE: ${{ github.event.inputs.invoice_no }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          envs: DIAG_INVOICE
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            export DIAG_INVOICE
            php artisan tinker --no-ansi <<'PHP'
            $inv = trim((string) getenv('DIAG_INVOICE')); $txs = \Illuminate\Support\Facades\DB::table('transactions')->where('invoice_no', $inv)->get(); echo "TX_JSON: " . $txs->toJson() . "\n"; foreach ($txs as $t) { $l = \Illuminate\Support\Facades\DB::table('transaction_sell_lines as tsl')->leftJoin('products as p', 'p.id', '=', 'tsl.product_id')->where('tsl.transaction_id', $t->id)->select('tsl.*', 'p.name as pname', 'p.sku')->get(); echo "LINES_{$t->id}_JSON: " . $l->toJson() . "\n"; $pay = \Illuminate\Support\Facades\DB::table('transaction_payments')->where('transaction_id', $t->id)->get(); echo "PAY_{$t->id}_JSON: " . $pay->toJson() . "\n"; $ret = \Illuminate\Support\Facades\DB::table('transactions')->where('return_parent_id', $t->id)->get(); echo "RETURNS_{$t->id}_JSON: " . $ret->toJson() . "\n"; }
            PHP
            cat > /tmp/diag_clover.php <<'PHPX'
            <?php
            require '/www/playlist.nivessa.com/app/vendor/autoload.php';
            $app = require '/www/playlist.nivessa.com/app/bootstrap/app.php';
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            use Illuminate\Support\Facades\DB;
            $inv = getenv('DIAG_INVOICE');
            $t = DB::table('transactions')->where('invoice_no', $inv)->first();
            $from = date('Y-m-d H:i:s', strtotime($t->transaction_date) - 3600);
            $to = date('Y-m-d H:i:s', strtotime($t->transaction_date) + 3600);
            echo "CLOVER_COLS: " . json_encode(DB::getSchemaBuilder()->getColumnListing('clover_payments')) . "\n";
            $cp = DB::table('clover_payments')->whereBetween('paid_at', [date('Y-m-d H:i:s', strtotime($from) - 9*3600), date('Y-m-d H:i:s', strtotime($to) + 9*3600)])->orderBy('paid_at')->get();
            echo "CLOVER_JSON: " . $cp->toJson() . "\n";
            $near = DB::table('transactions')->where('type','sell')->where('location_id',$t->location_id)->whereBetween('transaction_date',[$from,$to])->select('id','invoice_no','transaction_date','final_total','total_before_tax','tax_amount','status','contact_id')->orderBy('transaction_date')->get();
            echo "NEARBY_JSON: " . $near->toJson() . "\n";
            PHPX
            sed -i 's/^            //' /tmp/diag_clover.php
            DIAG_INVOICE="$DIAG_INVOICE" php /tmp/diag_clover.php 2>&1 | tail -c 60000
            rm -f /tmp/diag_clover.php
            echo "=== done ==="
