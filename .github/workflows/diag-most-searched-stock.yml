# READ-ONLY: times the Most Searched per-store stock matcher and renders the page view with sample rows. No writes.
name: Diag most searched stock

on:
  workflow_dispatch:

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Run matcher (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 180s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php -d memory_limit=1G artisan tinker --no-ansi <<'PHP'
            $bid = (int) \DB::table('business')->orderBy('id')->value('id');
            session(['business.id' => $bid]);
            $c = app(\App\Http\Controllers\WebsiteAdmin\SearchInsightsController::class);
            $m = new \ReflectionMethod($c, 'stockMatcher'); $m->setAccessible(true);
            $t = microtime(true); [$locs, $f] = $m->invoke($c);
            echo "build " . round(microtime(true) - $t, 2) . "s mem " . round(memory_get_peak_usage() / 1e6) . "MB\n";
            echo json_encode($locs) . "\n";
            $t = microtime(true);
            foreach (['taylor swift', 'beatles', 'radiohead vinyl', 'pink floyd dark side', 'vinyl', 'zzqqxx'] as $q) echo $q . ' => ' . json_encode($f($q)) . "\n";
            echo "6 lookups " . round((microtime(true) - $t) * 1000) . "ms\n";
            $rows = [['_id' => 'beatles', 'count' => 5, '_stock' => $f('beatles')], ['_id' => 'vinyl', 'count' => 2, '_stock' => null]];
            $html = view('website_admin.content.most_searched', ['stockLocations' => $locs, 'bridgeError' => null, 'queries' => $rows, 'artists' => [['query' => 'beatles', 'count' => 3, '_stock' => $f('beatles')]], 'artistError' => null, 'page' => 1, 'limit' => 500, 'total' => 2, 'totalPages' => 1, 'pageSizes' => [500], 'loadedAt' => 'now'])->renderSections()['content'];
            echo "view ok " . strlen($html) . " bytes\n";
            PHP
