# One-off, read-only: Pico sealed stock (vinyl/CD/cassette) by genre,
# on hand vs 90d/12mo sales, years of supply, compared to Hollywood.
# SELECTs + session temp tables only. Writes nothing.


name: Diag Pico sealed overstock (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_pico_sealed.php
            php /tmp/diag_pico_sealed.php
            rm -f /tmp/diag_pico_sealed.php
