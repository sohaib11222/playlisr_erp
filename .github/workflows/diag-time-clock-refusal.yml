# READ-ONLY (2026-10-30): why the time clock refused someone. No writes.
name: Diag time clock refusal

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Employee first name contains"
        required: true
        default: "zella"

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if grep -q . ~/.ssh/known_hosts 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 0

      - name: Inspect (read-only)
        uses: appleboy/ssh-action@v1.2.0
        env:
          DIAG_NAME: ${{ github.event.inputs.name }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 120s
          envs: DIAG_NAME
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            export DIAG_NAME
            php artisan tinker --no-ansi <<'PHP'
            $n = '%' . trim((string) getenv('DIAG_NAME')) . '%';
            $TC = \App\Services\TimeClockService::class;
            echo 'NOW ' . $TC::nowString() . "\n";
            echo 'SETTINGS ' . json_encode(['window' => $TC::scheduleWindow(), 'req_store' => $TC::requireAtStore(), 'req_sched' => $TC::requireSchedule(), 'has_data' => $TC::hasScheduleData($TC::now()->toDateString())]) . "\n";
            $users = \DB::table('users')->where(fn($q) => $q->where('first_name', 'like', $n)->orWhere('username', 'like', $n)->orWhere('email', 'like', $n))->get(['id', 'first_name', 'last_name', 'username', 'email', 'allow_login']);
            echo 'USERS ' . json_encode($users) . "\n";
            $ids = $users->pluck('id')->all();
            foreach ($TC::blockedAttempts() as $b) { if (in_array($b['user_id'] ?? 0, $ids) || ($b['at'] ?? '') >= $TC::now()->toDateString()) echo 'BLOCKED ' . json_encode($b) . "\n"; }
            echo 'PUNCHES ' . json_encode(\DB::table('time_clock_punches')->whereIn('user_id', $ids)->orderBy('id', 'desc')->limit(5)->get()) . "\n";
            echo 'SLING_TODAY_MATCH ' . json_encode(\DB::table('sling_shifts')->where('dtstart', '>=', $TC::now()->subHours(24)->format('Y-m-d H:i:s'))->where('dtstart', '<=', $TC::now()->addHours(12)->format('Y-m-d H:i:s'))->where(fn($q) => $q->where('user_name', 'like', $n)->orWhere('user_email', 'like', $n)->orWhereIn('erp_user_id', $ids))->get()) . "\n";
            echo 'SLING_TODAY_ALL ' . json_encode(\DB::table('sling_shifts')->whereBetween('dtstart', [$TC::now()->toDateString() . ' 00:00:00', $TC::now()->toDateString() . ' 23:59:59'])->get(['erp_user_id', 'user_email', 'location_name', 'dtstart', 'dtend', 'event_type'])) . "\n";
            foreach ($ids as $id) { foreach ([null, 1, 2, 3, 4] as $loc) { try { echo 'ALLOWS ' . $id . ' loc=' . json_encode($loc) . ' ' . json_encode($TC::scheduleAllows($id, $loc, 1)) . "\n"; } catch (\Throwable $e) { echo 'ALLOWS_ERR ' . $e->getMessage() . "\n"; } } }
            echo 'LOCS ' . json_encode(\DB::table('business_locations')->get(['id', 'name'])) . "\n";
            PHP
            echo "=== done ==="
