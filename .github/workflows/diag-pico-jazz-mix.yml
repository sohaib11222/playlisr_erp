# One-off, read-only: when did Pico start putting used jazz into sealed jazz?
# Weekly Pico arrivals of jazz vinyl by sealed/used + how added; Hollywood control.
# SELECTs + session temp tables only. Writes nothing. Runs on push to diag-jazz/**.
name: Diag Pico jazz sealed/used mix (read-only)

on:
  push:
    branches: ['diag-jazz/**']
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_pico_jazz_mix.php
            php /tmp/diag_pico_jazz_mix.php
            rm -f /tmp/diag_pico_jazz_mix.php
