# READ-ONLY: user reports the POS Requests report (/reports/pos-requests)
# stops showing data at Sep 7 no matter how far back the period is set.
# Check whether pos_search_misses actually stopped getting new rows around
# then, and look for recent errors on the logging endpoint.

name: Diag POS search misses gap

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Inspect pos_search_misses
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            echo "=== row counts by day, location 2, typed only, last 30 days ==="
            php artisan tinker --no-ansi <<'PHP'
            DB::table('pos_search_misses')->where('location_id', 2)->where('is_scan', 0)->where('created_at', '>=', now()->subDays(30))->selectRaw('DATE(created_at) as d, COUNT(*) as c')->groupBy('d')->orderBy('d')->get()->each(function($r){ echo "{$r->d}  {$r->c}\n"; });
            PHP
            echo "=== max created_at overall / per location ==="
            php artisan tinker --no-ansi <<'PHP'
            echo "overall max: " . DB::table('pos_search_misses')->max('created_at') . "\n";
            DB::table('pos_search_misses')->selectRaw('location_id, is_scan, MAX(created_at) as last_seen, COUNT(*) as c')->groupBy('location_id', 'is_scan')->orderBy('location_id')->get()->each(function($r){ echo "location_id={$r->location_id} is_scan={$r->is_scan} last_seen={$r->last_seen} count={$r->c}\n"; });
            PHP
            echo "=== business_locations id=2 ==="
            php artisan tinker --no-ansi <<'PHP'
            $r = DB::table('business_locations')->find(2); echo $r ? ($r->id . ' ' . $r->name . ' business_id=' . $r->business_id) : 'not found'; echo "\n";
            PHP
            echo "=== recent errors mentioning log-empty-search or pos_search_misses ==="
            grep -h "log-empty-search\|pos_search_miss\|PosSearchRequestController\|PosSearchMiss" storage/logs/laravel-*.log 2>/dev/null | tail -60
            echo "=== current asset_version (to check cache-busting) ==="
            grep -n "asset_version" config/constants.php
            echo "=== done ==="
