# READ-ONLY diagnostic: latest Genre Bible errors from the Laravel log.
name: Diag genre bible error

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Show Genre Bible errors (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 60s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            L=storage/logs/$(ls -t storage/logs | head -1)
            echo "log: $L"
            grep -n "GenreBible\|genre-bible\|ArtistGenreLookup\|genre_bible" "$L" | grep -i "error\|exception" | tail -4 | cut -c1-2500
            echo "--- last errors"
            tail -c 2000000 "$L" | grep -E "\.(ERROR|CRITICAL|EMERGENCY)" | tail -3 | cut -c1-2500
            echo "--- php/web server errors"
            ls -t storage/logs | head -5
            curl -s -o /dev/null -w "local feed %{http_code}\n" https://playlist.nivessa.com/genre-bible.json
