# READ-ONLY: dump the shelf-count Missing list with context.
# cashier, same as the Hollywood look-up. Branch-only (not main) so
# dispatching this doesn't touch main and trigger a production deploy
# while stores are open.

name: Diag shelf missing

on:
  push:
    branches: [diag/shelf-missing]

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Dump missing list
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 60s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            cat > /tmp/diag_shelf_missing.php <<'PHP'
            <?php
            require 'vendor/autoload.php'; $app = require 'bootstrap/app.php'; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            use Illuminate\Support\Facades\DB;
            $biz = 1;
            $hw = (int) App\BusinessLocation::where('business_id',$biz)->where('name','like','%hollywood%')->where('name','not like','%warehouse%')->value('id');
            echo "hollywood loc = $hw\n";
            $rows = json_decode((string) @file_get_contents(storage_path('app/shelf-missing-'.$biz.'.json')), true) ?: [];
            $cut = now()->subDays(90)->toDateTimeString();
            $rows = array_values(array_filter($rows, fn($r) => (int)$r['location_id'] === $hw && $r['at'] >= $cut));
            echo "rows=".count($rows)." units=".array_sum(array_column($rows,'units'))."\n";
            $svc = app(App\Services\ReorderService::class);
            $pids = array_values(array_unique(array_map(fn($r) => (int)$r['product_id'], $rows)));
            $all = DB::table('products as p')->leftJoin('variation_location_details as v', function($j) use ($hw){ $j->on('v.product_id','=','p.id')->where('v.location_id','=',$hw); })
              ->where('p.business_id',$biz)->where('p.is_inactive',0)
              ->select('p.id','p.name','p.artist','p.product_custom_field1 as cf1','p.category_id',DB::raw('SUM(v.qty_available) as q'))->groupBy('p.id','p.name','p.artist','p.product_custom_field1','p.category_id')->get();
            $byKey = []; $meta = [];
            foreach ($all as $p) { $k = $svc->albumKey($p->cf1 ?: $p->artist, $p->name); $meta[$p->id] = [$k, $p]; if ($k !== '') $byKey[$k][] = (int)$p->id; }
            $acts = DB::table('activity_log')->where('subject_type','App\\Product')->where('description','stock_changed')->where('created_at','>=','2026-10-14')
              ->where('properties','like','%bin count%')->get(['subject_id','properties','created_at'])->groupBy('subject_id');
            $manual = DB::table('transaction_sell_lines as l')->join('transactions as t','t.id','=','l.transaction_id')
              ->where('t.business_id',$biz)->where('t.type','sell')->where('t.status','final')->where('t.location_id',$hw)->where('t.transaction_date','>=',now()->subDays(120))
              ->where(function($w){ $w->whereNull('l.product_id')->orWhere('l.product_id',0); })->whereNotNull('l.product_name')
              ->select('l.product_name','l.product_artist',DB::raw('SUM(l.quantity-l.quantity_returned) as q'))->groupBy('l.product_name','l.product_artist')->get();
            $manK = []; foreach ($manual as $m) { $k = $svc->albumKey($m->product_artist, $m->product_name); if ($k !== '') $manK[$k] = ($manK[$k] ?? 0) + (float)$m->q; }
            echo "manual line titles 120d at HW: ".count($manual)."\n";
            $dup = [0,0,0]; $man = [0,0,0]; $cf = [0,0];
            foreach ($rows as $r) {
              $pid = (int)$r['product_id']; [$k, $p] = $meta[$pid] ?? ['', null];
              if ($p && trim((string)$p->artist) === '' && trim((string)$p->cf1) !== '') { $cf[0]++; $cf[1] += $r['units']; }
              $sib = array_values(array_diff($byKey[$k] ?? [], [$pid]));
              $sibUp = [];
              foreach ($sib as $s) foreach (($acts[$s] ?? []) as $a) { $n = json_decode($a->properties,true)['update_note'] ?? ''; if (preg_match('/([\d.]+) -> (\d+)\s*$/',$n,$mm) && (float)$mm[2] > (float)$mm[1]) $sibUp[] = $s.':'.$mm[1].'->'.$mm[2]; }
              if ($sib) { $dup[0]++; $dup[1] += $r['units']; $dup[2] += $r['units']*$r['unit_cost']; }
              $mq = $manK[$k] ?? 0;
              if ($mq > 0) { $man[0]++; $man[1] += min($mq,$r['units']); $man[2] += min($mq,$r['units'])*$r['unit_cost']; }
              if ($sib || $mq > 0) echo implode("\t", [$pid, mb_substr($r['name'],0,34), 'miss='.$r['units'], 'key='.$k, 'sibs='.implode(',',array_map(fn($s)=>$s.'('.(float)($meta[$s][1]->q ?? 0).')',$sib)), 'sibUp='.implode(',',$sibUp), 'manual120d='.$mq])."\n";
            }
            echo "\nrows with another ERP entry for same album: rows={$dup[0]} units={$dup[1]} cost=".round($dup[2],2)."\n";
            echo "rows where same album was rung as a manual item (120d): rows={$man[0]} units<= {$man[1]} cost=".round($man[2],2)."\n";
            echo "rows with artist only in custom field: rows={$cf[0]} units={$cf[1]}\n";
            PHP
            php /tmp/diag_shelf_missing.php; rm -f /tmp/diag_shelf_missing.php
