# READ-ONLY: dump the shelf-count Missing list with context.
# cashier, same as the Hollywood look-up. Branch-only (not main) so
# dispatching this doesn't touch main and trigger a production deploy
# while stores are open.

name: Diag shelf missing

on:
  push:
    branches: [diag/shelf-missing]

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Dump missing list
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 60s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            cat > /tmp/diag_shelf_missing.php <<'PHP'
            <?php
            require 'vendor/autoload.php'; $app = require 'bootstrap/app.php'; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            use Illuminate\Support\Facades\DB;
            $biz = 1;
            $hw = (int) App\BusinessLocation::where('business_id',$biz)->where('name','like','%hollywood%')->where('name','not like','%warehouse%')->value('id');
            echo "hollywood loc = $hw\n";
            $rows = json_decode((string) @file_get_contents(storage_path('app/shelf-missing-'.$biz.'.json')), true) ?: [];
            $cut = now()->subDays(90)->toDateTimeString();
            $rows = array_values(array_filter($rows, fn($r) => (int)$r['location_id'] === $hw && $r['at'] >= $cut));
            echo "rows=".count($rows)." units=".array_sum(array_column($rows,'units'))."\n";
            $c = app(App\Http\Controllers\ShelfCountController::class);
            $m = new ReflectionMethod($c, 'netMissing'); $m->setAccessible(true);
            $net = $m->invoke($c, $biz, $hw, (string) DB::table('business_locations')->where('id',$hw)->value('name'), $rows);
            $u = $f = $mn = $cost = 0; $art = [];
            foreach ($net as $r) { $u += $r['units']; $f += $r['found']; $mn += $r['manual']; $cost += $r['units']*$r['unit_cost']; if ($r['units']>0) { $a = trim((string)$r['artist']) ?: '(no artist)'; $art[$a] = ($art[$a] ?? 0) + $r['units']*$r['unit_cost']; } }
            echo "net units=$u found=$f manual=$mn cost=".round($cost,2)."\n";
            arsort($art); print_r(array_slice($art,0,12,true));
            foreach ($net as $r) if ($r['found'] || $r['manual']) echo $r['product_id']."\t".$r['name']."\tshort=".$r['short']."\tfound=".$r['found']."\tmanual=".$r['manual']."\tnet=".$r['units']."\n";
            PHP
            php /tmp/diag_shelf_missing.php; rm -f /tmp/diag_shelf_missing.php
