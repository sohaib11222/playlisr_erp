# Read-only: aggregate location (area code / zip / city) of event-RSVP contacts. No names or numbers printed.
name: Diag RSVP contacts geo

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          script: |
            echo '' | base64 -d > /tmp/rsvp_geo.php
            cd /www/playlist.nivessa.com/app && php artisan tinker /tmp/rsvp_geo.php 2>&1
            rm -f /tmp/rsvp_geo.php
