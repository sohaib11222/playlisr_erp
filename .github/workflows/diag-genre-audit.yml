# READ-ONLY (Sarah, 2026-10-21): genre audit - what kinds of wrong genres exist. No writes.
name: Diag genre audit

on:
  push:
    branches: [diag/genre-audit]

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if grep -q . ~/.ssh/known_hosts 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 0

      - name: Genre fix live page check (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php -d memory_limit=2000M artisan tinker --no-ansi <<'PHP'
            $u = \App\User::whereNull('deleted_at')->whereRaw('lower(first_name)=?', ['jonathan'])->first(); auth()->login($u);
            $req = \Illuminate\Http\Request::create('/products/genre-fix', 'GET', ['artist' => 'Sade']); $req->setLaravelSession(app('session.store')); session()->put('user.business_id', $u->business_id); app()->instance('request', $req);
            $html = (string) app(\App\Http\Controllers\GenreFixController::class)->index($req)->render();
            echo "LIVE OK " . strlen($html) . " rows=" . substr_count($html, 'gf-keep') . " sidebar=" . substr_count($html, 'Genre Fix') . "\n";
            echo 'STEPS ' . substr_count($html, 'Step 1') . substr_count($html, 'Step 2') . ' cards=' . substr_count($html, 'gf-card" data-key') . ' fixall=' . (preg_match('/Fix all [0-9,]+/', $html, $mm) ? $mm[0] : 'none') . "\n"; $html = null;
            $svc = new \App\Services\DiscogsGenreBackfillService(); $m = new \ReflectionMethod($svc, 'matchExistingSubCategory'); $m->setAccessible(true);
            foreach ([15 => ['Funk / Soul'], 175 => ['Hip Hop'], 55 => ['Indie Rock', 'Rock'], 15 => ['Stage & Screen']] as $cat => $c) echo "MATCH {$cat} " . json_encode($c) . " => " . \DB::table('categories')->where('id', $m->invoke($svc, $u->business_id, $cat, $c))->value('name') . "\n";
            PHP
