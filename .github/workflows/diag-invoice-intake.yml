# READ-ONLY dry run of the invoice intake (imports nothing). Branch-only.
name: Diag invoice intake
on:
  push:
    branches: [diag/invoice-intake]
concurrency:
  group: production-diag
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Copy test classes
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          source: "intake-test/*"
          target: "/tmp/nivessa-diag"
      - name: Dry run
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            mkdir -p /tmp/nivessa-diag
            cat > /tmp/nivessa-diag/c.php <<'PHP'
            <?php
            require 'vendor/autoload.php'; $app = require 'bootstrap/app.php'; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            foreach (['sale_pos/partials/quick_receive_modal','purchase/partials/update_purchase_status_modal','purchase/index','report/distributor_invoice_audit','admin/distributor_invoice_import'] as $v) {
              $php = Blade::compileString(file_get_contents(resource_path("views/$v.blade.php")));
              file_put_contents('/tmp/nivessa-diag/v.php', $php);
              echo $v . ': ' . trim(shell_exec('php -l /tmp/nivessa-diag/v.php 2>&1 | head -1')) . "\n";
            }
            PHP
            php /tmp/nivessa-diag/c.php 2>&1 | grep -v Deprecated
            php artisan view:cache 2>&1 | tail -3
            rm -rf /tmp/nivessa-diag
