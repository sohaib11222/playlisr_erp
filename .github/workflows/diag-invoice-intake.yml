# READ-ONLY dry run of the invoice intake (imports nothing). Branch-only.
name: Diag invoice intake
on:
  push:
    branches: [diag/invoice-intake]
concurrency:
  group: production-diag
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Copy test classes
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          source: "intake-test/*"
          target: "/tmp/nivessa-diag"
      - name: Dry run
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            cat > /tmp/nivessa-diag/run.php <<'PHP'
            <?php
            require 'vendor/autoload.php'; $app = require 'bootstrap/app.php'; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            foreach (['RawImapClient','PdfTextExtractor','DistributorInvoiceParser','DistributorInvoiceIntake'] as $c) require "/tmp/nivessa-diag/intake-test/$c.php";
            $intake = new App\Services\DistributorInvoiceIntake();
            $f = Closure::bind(function () {
              $logins = $this->amsLogins(); echo "logins: " . count($logins) . " " . implode(',', array_column($logins, 'account')) . "\n";
              $login = $logins[0]; $jar = tempnam('/tmp', 'amsd'); $base = 'https://www.allmediasupply.com';
              $this->curl($jar, 'GET', $base . '/Account/LogOn');
              $this->curl($jar, 'POST', $base . '/Account/LogOn', http_build_query(['AccountNumber' => $login['account'], 'UserName' => $login['user'], 'Password' => $login['pass'], 'RememberMe' => 'false', 'ReturnUrl' => '']), ['Content-Type: application/x-www-form-urlencoded']);
              list(, $home) = $this->curl($jar, 'GET', $base . '/');
              echo "signed in: " . ((stripos($home, 'Sign out') !== false || stripos($home, 'logout') !== false) ? 'yes' : 'no') . "\n";
              list($code, $json) = $this->curl($jar, 'POST', $base . '/Account/Invoices_Read', 'sort=InvoiceDate-desc&page=1&pageSize=60&group=&filter=', ['Content-Type: application/x-www-form-urlencoded; charset=UTF-8', 'X-Requested-With: XMLHttpRequest']);
              $j = json_decode($json, true); echo "list HTTP $code total " . ($j['Total'] ?? '?') . "\n";
              $since = strtotime('2026-08-21');
              foreach (($j['Data'] ?? []) as $i => $row) {
                $ts = preg_match('/Date\((\d+)\)/', $row['InvoiceDate'], $m) ? (int) ($m[1] / 1000) : 0;
                if ($ts < $since) continue;
                $inv = str_pad((string) $row['InvoiceNumber'], 7, '0', STR_PAD_LEFT);
                $handled = $this->alreadyHandled('ams', $inv);
                $line = date('Y-m-d', $ts) . " $inv acct {$row['AccountNumber']} handled " . ($handled ? 'yes' : 'NO');
                if ($i < 8 || !$handled) {
                  list($dc, $pdf) = $this->curl($jar, 'GET', $base . '/Account/GetDocument/' . (int) $row['DocumentId']);
                  $p = App\Services\DistributorInvoiceParser::parse('ams', $pdf);
                  $line .= " | read " . ($p['header']['invoice'] ?? '?') . " " . ($p['header']['date'] ?? '?') . " acct " . ($p['header']['account'] ?? '?') . " lines " . count($p['items']) . " sum {$p['sum']} goods " . ($p['totals']['goods'] ?? '?') . " match " . var_export($p['goods_matches'], true);
                  $types = []; foreach ($p['items'] as $it) { $types[$it['prodType']] = ($types[$it['prodType']] ?? 0) + 1; if (strpos($it['upc'], '5061110805478') !== false || stripos($it['description'], 'GONG') === 0) $line .= " | GONG " . json_encode($it); }
                  $line .= ' types ' . json_encode($types);
                  $sc = Storage::disk('local')->exists("ams-imports/$inv.json") ? json_decode(Storage::disk('local')->get("ams-imports/$inv.json"), true) : null;
                  if ($sc) { $n = DB::table('purchase_lines')->where('transaction_id', $sc['transaction_id'] ?? 0)->count(); $line .= " | ERP #{$sc['transaction_id']} has $n lines"; }
                  $loc = App\Services\DistributorInvoiceImport::locationForAccount(1, 'ams', $p['header']['account'] ?? ''); $line .= " store $loc";
                  if (count($p['items'])) { $pv = App\Services\DistributorInvoiceImport::preview(1, array_map(function ($it) { return ['upc' => $it['upc'], 'description' => $it['description'], 'format' => $it['prodType'], 'qty' => $it['qty'], 'unit_price' => $it['unitPrice'], 'line_total' => $it['lineTotal']]; }, $p['items']), 8, $loc, $p['header']['date'] ?? ''); $new = array_values(array_filter($pv, function ($l) { return !$l['matched']; })); $line .= " | unmatched " . count($new) . ($new ? ': ' . implode('; ', array_map(function ($l) { return $l['upc'] . ' ' . $l['new_product']['name'] . ' [' . $l['new_product']['category_name'] . ' ' . $l['new_product']['sell_price'] . ']'; }, array_slice($new, 0, 6))) : ''); }
                }
                echo $line . "\n";
              }
              @unlink($jar);
            }, $intake, App\Services\DistributorInvoiceIntake::class);
            $f();
            echo "mailbox test: ";
            $s2 = Closure::bind(function () { try { $imap = new App\Services\RawImapClient(); $imap->connect(config('inventory_check.email.host', 'imap.gmail.com'), (int) config('inventory_check.email.port', 993)); $imap->login(config('inventory_check.email.username'), str_replace(' ', '', (string) config('inventory_check.email.password'))); $imap->selectFolder('[Gmail]/All Mail'); $u = $imap->uidSearchSinceFrom(now()->subDays(60), 'aent.com'); echo "login ok, aent.com emails in 60 days: " . count($u) . "\n"; $imap->logout(); } catch (\Throwable $e) { echo "FAILED " . $e->getMessage() . "\n"; } }, $intake, App\Services\DistributorInvoiceIntake::class);
            $s2();
            PHP
            php /tmp/nivessa-diag/run.php 2>&1 | grep -v Deprecated | head -120
            rm -rf /tmp/nivessa-diag
