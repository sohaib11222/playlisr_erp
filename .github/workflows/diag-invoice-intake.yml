# READ-ONLY dry run of the invoice intake (imports nothing). Branch-only.
name: Diag invoice intake
on:
  push:
    branches: [diag/invoice-intake]
concurrency:
  group: production-diag
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Copy test classes
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          source: "intake-test/*"
          target: "/tmp/nivessa-diag"
      - name: Dry run
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            cat > /tmp/nivessa-diag/run.php <<'PHP'
            <?php
            require 'vendor/autoload.php'; $app = require 'bootstrap/app.php'; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            foreach (['PurchaseDuplicateGuard'] as $c) require "/tmp/nivessa-diag/intake-test/$c.php";
            foreach ([[45984,2,'Bad Omens Finding God HW'],[154019,2,'Poppy I Disagree HW'],[45984,1,'Bad Omens at Pico'],[160349,2,'Jimin HW (on intake order 183104)'],[14851,2,'Aphex SAW HW (Redeye 180117 + order 183125)'],[10289,2,'Tribe Called Quest (183104 ordered)']] as $t) {
              $t0 = microtime(true); $f = App\Services\PurchaseDuplicateGuard::quickReceiveFlag(1, $t[1], $t[0]);
              echo $t[2] . ': ' . var_export($f, true) . ' (' . round((microtime(true)-$t0)*1000) . " ms)\n";
            }
            PHP
            php /tmp/nivessa-diag/run.php 2>&1 | grep -v Deprecated | head -120
            rm -rf /tmp/nivessa-diag
