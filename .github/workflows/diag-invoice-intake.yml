# READ-ONLY dry run of the invoice intake (imports nothing). Branch-only.
name: Diag invoice intake
on:
  push:
    branches: [diag/invoice-intake]
concurrency:
  group: production-diag
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Copy test classes
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          source: "intake-test/*"
          target: "/tmp/nivessa-diag"
      - name: Dry run
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            cat > /tmp/nivessa-diag/run.php <<'PHP'
            <?php
            require 'vendor/autoload.php'; $app = require 'bootstrap/app.php'; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            foreach (['RawImapClient','PdfTextExtractor','DistributorInvoiceParser','DistributorInvoiceImport','DistributorInvoiceIntake'] as $c) require "/tmp/nivessa-diag/intake-test/$c.php";
            foreach (['0625013','0617326','0616781','0614191','0611730','0611035','0610675','0606371'] as $i) { $f="ams-imports/$i.json"; $j = Storage::disk('local')->exists($f) ? json_decode(Storage::disk('local')->get($f), true) : null; echo "$i " . ($j ? ('tx ' . ($j['transaction_id'] ?? '?') . ' catch_up_at ' . ($j['catch_up_at'] ?? '-') . ' catch_up_tx ' . ($j['catch_up_tx'] ?? '-')) : 'no sidecar') . "\n"; }
            PHP
            php /tmp/nivessa-diag/run.php 2>&1 | grep -v Deprecated | head -120
            rm -rf /tmp/nivessa-diag
