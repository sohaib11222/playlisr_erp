# READ-ONLY dry run of the invoice intake (imports nothing). Branch-only.
name: Diag invoice intake
on:
  push:
    branches: [diag/invoice-intake]
concurrency:
  group: production-diag
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Copy test classes
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          source: "intake-test/*"
          target: "/tmp/nivessa-diag"
      - name: Dry run
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            cat > /tmp/nivessa-diag/run.php <<'PHP'
            <?php
            require 'vendor/autoload.php'; $app = require 'bootstrap/app.php'; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            foreach (['RawImapClient','PdfTextExtractor','DistributorInvoiceParser','DistributorInvoiceImport','DistributorInvoiceIntake'] as $c) require "/tmp/nivessa-diag/intake-test/$c.php";
            $r = (new App\Services\DistributorInvoiceIntake())->run(60, null, true);
            foreach ($r as $e) echo "[" . ($e['status'] ?? '') . "] " . strtoupper($e['distributor'] ?? '') . " " . ($e['invoice'] ?? '') . " | " . ($e['msg'] ?? '') . "\n";
            echo "== beabadoobee\n";
            foreach (DB::table('variations as v')->join('products as p','p.id','=','v.product_id')->whereIn('v.sub_sku',['5060257966189','060257966189','5060257966165','5060257966271'])->orWhere('p.name','like','%beabadoobee%')->get(['p.id','p.name','v.id as vid','v.sub_sku','p.created_at','p.is_inactive']) as $x) {
              $pl = DB::table('purchase_lines as pl')->join('transactions as t','t.id','=','pl.transaction_id')->where('pl.variation_id',$x->vid)->get(['t.id','t.type','t.status','t.ref_no','t.transaction_date','t.location_id','pl.quantity']);
              $st = DB::table('variation_location_details')->where('variation_id',$x->vid)->pluck('qty_available','location_id');
              $sold = DB::table('transaction_sell_lines')->where('variation_id',$x->vid)->sum('quantity');
              echo "$x->id | $x->name | $x->sub_sku | created " . substr($x->created_at,0,10) . " | stock " . json_encode($st) . " sold $sold | purchases " . json_encode($pl) . "\n";
            }
            PHP
            php /tmp/nivessa-diag/run.php 2>&1 | grep -v Deprecated | head -120
            rm -rf /tmp/nivessa-diag
