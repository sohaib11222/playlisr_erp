# READ-ONLY dry run of the invoice intake (imports nothing). Branch-only.
name: Diag invoice intake
on:
  push:
    branches: [diag/invoice-intake]
concurrency:
  group: production-diag
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Copy test classes
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          source: "intake-test/*"
          target: "/tmp/nivessa-diag"
      - name: Dry run
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            grep -c "quickReceiveFlag" app/Http/Controllers/PosQuickReceiveController.php app/Services/PurchaseDuplicateGuard.php
            grep -c "resp.flag && window.toastr.warning" resources/views/sale_pos/partials/quick_receive_modal.blade.php
            grep -n "asset_version" config/constants.php
            git log -1 --format="%h %s"
            php artisan view:cache >/dev/null 2>&1; echo "view cache exit $?"; php artisan view:clear >/dev/null 2>&1
            tail -n 40 storage/logs/laravel-$(date +%Y-%m-%d).log 2>/dev/null | grep -i "quickreceive\|duplicate flag" | tail -5
            rm -rf /tmp/nivessa-diag
