# Syntax-checks the PHP files a branch touches before it can reach main (where
# a push deploys straight to production). Cheap safety net: this repo has no
# other CI, and a parse error in a controller takes the whole app down rather
# than failing loudly at build time.
#
# Blade templates are skipped — `php -l` cannot parse Blade directives, so it
# would report false errors on every view.

name: PHP lint

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deliberately uses the PHP preinstalled on the runner rather than
      # shivammathur/setup-php. This gate only needs a parser, and codeload
      # rate-limited that action's download hard enough to fail the job three
      # attempts in a row — an outage in a third-party action should not be
      # able to block a syntax check. Production runs 7.4 and the runner is
      # newer, which is fine for catching parse errors.
      - name: Show PHP version
        run: php -v

      - name: php -l on changed PHP files
        run: |
          base=$(git merge-base origin/main HEAD || echo HEAD~1)
          files=$(git diff --name-only "$base" HEAD -- '*.php' \
            | { grep -v '^vendor/' || true; } \
            | { grep -v '\.blade\.php$' || true; })
          if [ -z "$files" ]; then
            echo "No PHP files changed."
            exit 0
          fi
          status=0
          for f in $files; do
            [ -f "$f" ] || continue
            echo "--- $f"
            php -l "$f" || status=1
          done
          exit $status
