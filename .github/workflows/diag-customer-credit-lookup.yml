name: Diag customer credit + points lookup

# Read-only: find a customer by name and print their store credit balance,
# loyalty points, masked email/phone and recent credit notes. Used to check
# why a customer's credit or points don't show on nivessa.com.

on:
  workflow_dispatch:
    inputs:
      name:
        description: Customer name (e.g. "Jane Doe")
        required: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Run on prod
        uses: appleboy/ssh-action@v1.2.0
        env:
          LOOKUP_NAME: ${{ inputs.name }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: LOOKUP_NAME
          command_timeout: 5m
          script: |
            echo '' | base64 -d > /tmp/credit_lookup.php
            cd /www/playlist.nivessa.com/app && LOOKUP_NAME="$LOOKUP_NAME" php artisan tinker /tmp/credit_lookup.php 2>&1
            rm -f /tmp/credit_lookup.php
