# Read-only: website Get a Quote usage (sell_quotes counts by day/hour/store/size,
# repeat sellers, who came in to sell after quoting) + form-view hits from access logs.
# SELECTs only. Writes nothing.

name: Diag sell quotes usage (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          command_timeout: 10m
          script: |
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_sq.php
            php /tmp/diag_sq.php
            rm -f /tmp/diag_sq.php
            echo "### access logs"
            for f in $(ls -d /www/playlist.nivessa.com/logs/* /www/playlist.nivessa.com/log/* /var/log/nginx/*access* /var/log/apache2/*access* /var/log/httpd/*access* 2>/dev/null); do echo "log file: $f"; done
            for f in $(ls /www/playlist.nivessa.com/logs/*access* /www/playlist.nivessa.com/log/*access* /var/log/nginx/*access* 2>/dev/null); do
              echo "== $f"
              zgrep -h 'sell-quote/options' "$f" 2>/dev/null | grep -o '\[[0-9]*/[A-Za-z]*/[0-9]*:[0-9]*' | sort | uniq -c | tail -30
              echo "-- distinct IPs viewing form:"; zgrep -h 'sell-quote/options' "$f" 2>/dev/null | awk '{print $1}' | sort -u | wc -l
              echo "-- start/price posts:"; zgrep -h -E 'POST /sell-quote/(start|[A-Za-z0-9]+/price)' "$f" 2>/dev/null | grep -o '\[[0-9]*/[A-Za-z]*/[0-9]*' | sort | uniq -c
            done
            true
