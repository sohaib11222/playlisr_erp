# READ-ONLY diagnostic: identify the automated caller creating mass_add
# products under a stale account. Runs two read-only probes on the server
# (access-log scan + DB cadence/session query). No writes. Reuses the
# Deploy production SSH secrets. Delete after use.

name: Nivessa · mass-add caller probe

on:
  workflow_dispatch:

concurrency:
  group: diag-mass-add-caller
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Run read-only probes over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 180s
          script: |
            cd /www/playlist.nivessa.com/app
            echo "########## ACCESS-LOG PROBE ##########"
            bash scripts/diag_mass_add_logs.sh || echo "log probe failed"
            echo "########## DB CADENCE / SESSION PROBE ##########"
            php artisan tinker scripts/diag_mass_add_probe.php || echo "db probe failed"
