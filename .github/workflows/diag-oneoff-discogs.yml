name: Diag business check
on:
  workflow_dispatch:
concurrency:
  group: diag-oneoff
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: known_hosts
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts || true
      - name: Diagnose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          command_timeout: 5m
          script_stop: false
          script: |
            cd /www/playlist.nivessa.com/app
            echo "=== candidate: sealed, in stock, recently added, no street date yet ==="
            php artisan tinker <<'PHPEOF'
            $rows = \DB::table('products')
              ->where('business_id',1)
              ->where('quantity','>',0)
              ->where(function($q){ $q->where('category','like','%Sealed%')->orWhere('sub_category','like','%Sealed%'); })
              ->where(function($q){ $q->whereNull('product_custom_field2')->orWhere('product_custom_field2',''); })
              ->where('created_at','>=', now()->subDays(60))
              ->orderByDesc('created_at')
              ->limit(60)
              ->get(['id','name','artist','quantity','created_at','category']);
            echo "count=".$rows->count().PHP_EOL;
            foreach($rows as $r){ echo $r->id.' | '.$r->artist.' - '.$r->name.' | qty='.$r->quantity.' | '.$r->created_at.' | '.$r->category.PHP_EOL; }
            PHPEOF
