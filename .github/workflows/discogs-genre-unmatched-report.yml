# One-off, read-only report: which Discogs genres/styles don't match any
# existing sub-category, ranked by frequency, so Sarah can decide what's
# worth adding to /taxonomies. Manual dispatch only — no schedule, this
# isn't an ongoing job. Writes nothing to the database.
#
# Uses the same secrets as Deploy production:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, (optional DEPLOY_PORT)

name: Report unmatched genres (Discogs)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Keep scanning for up to this many minutes
        required: true
        default: '10'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Run discogs:genre-unmatched-report
        uses: appleboy/ssh-action@v1.2.0
        env:
          RUN_MINUTES: ${{ github.event.inputs.minutes || '10' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 20m
          envs: RUN_MINUTES
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo "=== running discogs:genre-unmatched-report --minutes=$RUN_MINUTES ==="
            php artisan discogs:genre-unmatched-report --minutes="$RUN_MINUTES"
            echo "=== done ==="
