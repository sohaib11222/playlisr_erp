# READ-ONLY: user reports clicking any task (Edit page) throws a 500.
# Pull the actual exception from the Laravel log instead of guessing.
name: Diag task edit 500

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Tail laravel.log and try hitting an edit page (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            echo "=== log files in storage/logs ==="
            ls -la storage/logs/
            echo "=== last 120 lines of the most recently modified log file ==="
            LATEST_LOG=$(ls -t storage/logs/*.log 2>/dev/null | head -1)
            echo "using: $LATEST_LOG"
            tail -n 120 "$LATEST_LOG"
            echo "=== reproduce projects.index render as an authenticated user, the way the controller does ==="
            php artisan tinker --no-ansi <<'PHP'
            $u = App\User::where('business_id',1)->where('allow_login',1)->where('status','active')->first();
            Auth::login($u);
            echo "logged in as: " . $u->first_name . " " . $u->last_name . " (id={$u->id})\n";
            $projects = App\Project::with(['creator','startedBy','completedBy','contributors'])->where('business_id',1)->orderByDesc('created_at')->paginate(50);
            echo "projects fetched: " . $projects->count() . "\n";
            try { $html = view('projects.index', ['projects'=>$projects,'status'=>null,'priority'=>null,'store'=>null,'storeLabels'=>['pico'=>'Pico','hollywood'=>'Hollywood'],'priorityLabels'=>['high'=>'High','medium'=>'Medium','low'=>'Low'],'canToggleStore'=>true])->render(); echo "RENDER OK, length=" . strlen($html) . "\n"; } catch (\Throwable $e) { echo "RENDER THREW: " . get_class($e) . ": " . $e->getMessage() . "\n" . $e->getFile() . ":" . $e->getLine() . "\n"; echo $e->getTraceAsString() . "\n"; }
            PHP
            echo "=== done ==="
