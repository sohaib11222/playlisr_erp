# READ-ONLY diagnostic: current unpaid listening parties as the live page
# would show them right now. One-off; delete after use.
name: Diag current pending parties

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: List current unpaid parties (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            $businessId = \DB::table('business')->value('id');
            $locations = \DB::table('business_locations')->where('business_id', $businessId)->where('is_active', 1)->orderBy('name')->pluck('name', 'id');
            $lcc = app(\App\Http\Controllers\ListingCommissionController::class);
            $ref = new \ReflectionMethod($lcc, 'unpaidListeningParties');
            $ref->setAccessible(true);
            $pStart = now()->subDays(30)->toDateString();
            $pEnd = now()->toDateString();
            $rows = $ref->invoke($lcc, $businessId, $locations, $pStart, $pEnd);
            echo "window: " . $pStart . " to " . $pEnd . "\n";
            echo "count: " . count($rows) . "\n";
            foreach ($rows as $r) {
                echo "=== " . $r['date'] . " | " . $r['name'] . " | " . $r['location_name'] . " ===\n";
                $e = $r['estimate'];
                if (!$e) { echo "  no estimate\n"; continue; }
                echo "  window " . $e['window'] . ", sales $" . $e['sales'] . ", pool $" . $e['pool'] . (($e['solo'] ?? false) ? " (SOLO - sales commission only)" : "") . "\n";
                foreach ($e['staff'] as $s) {
                    echo "    - " . $s['name'] . ": $" . $s['amount'] . "\n";
                }
            }
            PHP
            echo "=== done ==="
