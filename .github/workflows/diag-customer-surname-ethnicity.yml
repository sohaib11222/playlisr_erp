# Read-only: estimates the share of customers with Hispanic/Latino surnames using the
# US Census 2010 surname list (pcthispanic). Prints only aggregate counts to the log;
# the per-customer CSV is a 1-day-retention artifact. Estimates, not self-reported data.
name: Diag customer surname ethnicity

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Export customer names on prod
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/k && chmod 600 /tmp/k
          SSH="ssh -i /tmp/k -p ${{ steps.flags.outputs.ssh_port }} -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST"
          $SSH "echo '' | base64 -d > /tmp/cust_names.php && cd /www/playlist.nivessa.com/app && php artisan tinker /tmp/cust_names.php; rm -f /tmp/cust_names.php"
          mkdir -p out
          scp -i /tmp/k -P ${{ steps.flags.outputs.ssh_port }} -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST:/tmp/customer_names.csv" out/raw.csv
          $SSH "rm -f /tmp/customer_names.csv"
          rm -f /tmp/k

      - name: Score against Census surname list
        run: |
          curl -sSL -o names.zip https://www2.census.gov/topics/genealogy/2010surnames/names.zip
          unzip -o -q names.zip
          echo '' | base64 -d > score.py
          python3 score.py Names_2010Census.csv out/raw.csv out/customer_surname_scores.csv
          rm -f out/raw.csv

      - uses: actions/upload-artifact@v4
        with:
          name: customer-surname-scores
          path: out/customer_surname_scores.csv
          retention-days: 1
