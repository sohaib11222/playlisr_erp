name: Diag payout file raw dump
on:
  workflow_dispatch: {}
concurrency:
  group: production-diag
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if grep -q . ~/.ssh/known_hosts 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 0
      - name: Raw dump of payout files + mtimes (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 60s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            echo "--- file listing/mtimes ---"
            ls -la storage/app/*commission-payouts.json 2>&1
            echo ""
            echo "--- listing-commission-payouts.json: total entry count + LAST 10 raw ---"
            php -r '
              $f = "storage/app/listing-commission-payouts.json";
              if (!file_exists($f)) { echo "FILE DOES NOT EXIST\n"; exit; }
              $j = json_decode(file_get_contents($f), true);
              echo "total entries: ".count($j)."\n";
              $last = array_slice($j, -10);
              foreach ($last as $e) { echo json_encode($e)."\n"; }
            '
            echo ""
            echo "--- sales-commission-payouts.json: total entry count + LAST 10 raw ---"
            php -r '
              $f = "storage/app/sales-commission-payouts.json";
              if (!file_exists($f)) { echo "FILE DOES NOT EXIST\n"; exit; }
              $j = json_decode(file_get_contents($f), true);
              echo "total entries: ".count($j)."\n";
              $last = array_slice($j, -10);
              foreach ($last as $e) { echo json_encode($e)."\n"; }
            '
            echo "=== done ==="
