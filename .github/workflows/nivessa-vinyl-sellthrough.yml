# Read-only report: per-subcategory sell-through for items priced since a
# cutoff date. "Priced" = product created on/after the cutoff with a sell
# price set. "Sold" = of those, how many appear in a finalized sell.
# No writes — pure SELECT. Reuses the Deploy production SSH secrets.

name: Nivessa · vinyl sell-through report

on:
  workflow_dispatch:
    inputs:
      since:
        description: Count items priced on/after this date (YYYY-MM-DD)
        required: true
        default: '2026-01-01'

concurrency:
  group: nivessa-vinyl-sellthrough
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Run sell-through query over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 120s
          # drone-ssh runs each line as its own command, so the report script
          # is base64-encoded into a single line, decoded to a temp file, and
          # executed via `php artisan tinker <file>` (full Laravel bootstrap).
          script: |
            echo "=== sell-through, items priced since: ${{ github.event.inputs.since }} ==="
            echo '' | base64 -d > /tmp/st_report.php
            cd /www/playlist.nivessa.com/app && ST_SINCE='${{ github.event.inputs.since }} 00:00:00' php artisan tinker /tmp/st_report.php
            rm -f /tmp/st_report.php
