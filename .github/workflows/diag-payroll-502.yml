# READ-ONLY diagnostic: which users can open /payroll (read only).
name: Diag payroll 502

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Count staff with/without a phone number (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); $c=app(App\Http\Controllers\PayrollController::class); $m=new ReflectionMethod($c,"isPayrollUser"); $m->setAccessible(true); $yes=[]; $no=0; foreach (App\User::whereNull("deleted_at")->get() as $u) { Auth::setUser($u); if ($m->invoke($c)) { $yes[]=$u->id." ".$u->first_name." ".$u->last_name." (".($u->allow_login?"login on":"login off").")"; } else { $no++; } } echo "ALLOWED: ".implode(" | ",$yes)."\n"; echo "BLOCKED users: ".$no."\n"; foreach (App\User::where("last_name","like","%hedvat%")->orWhere("id",10)->get() as $u) echo "HEDVAT/10: ".$u->id." ".$u->first_name." ".$u->last_name."\n";'
