# READ-ONLY diagnostic: confirm the deployed live-Sling-based estimate
# produces the expected result for all 5 confirmed cases. One-off; delete
# after use.
name: Diag verify live estimate

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Recompute unpaid-party estimates with deployed code (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 120s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            $businessId = \DB::table('business')->value('id');
            $locations = \DB::table('business_locations')->where('business_id', $businessId)->where('is_active', 1)->orderBy('name')->pluck('name', 'id');
            $lcc = app(\App\Http\Controllers\ListingCommissionController::class);
            $ref = new \ReflectionMethod($lcc, 'unpaidListeningParties');
            $ref->setAccessible(true);
            $rows = $ref->invoke($lcc, $businessId, $locations, '2026-08-26', '2026-09-25');
            foreach ($rows as $r) {
                echo "=== " . $r['date'] . " | " . $r['name'] . " | " . $r['location_name'] . " ===\n";
                $e = $r['estimate'];
                if (!$e) { echo "  no estimate\n"; continue; }
                echo "  window " . $e['window'] . ", sales $" . $e['sales'] . ", pool $" . $e['pool'] . (($e['solo'] ?? false) ? " (SOLO)" : "") . "\n";
                foreach ($e['staff'] as $s) { echo "    - " . $s['name'] . ": $" . $s['amount'] . "\n"; }
            }
            PHP
            echo "=== done ==="
