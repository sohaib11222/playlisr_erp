# READ-ONLY diagnostic: verify liveEventCounts() and the new RSVP-scaled
# window produce sane results for recent parties before deploying. One-off;
# delete after use.
name: Diag rsvp window

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Test liveEventCounts + estimate (read-only, code not yet deployed)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 60s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            $businessId = \DB::table('business')->value('id');
            $items = \App\Http\Controllers\EventsController::load($businessId)['items'] ?? [];
            $items = collect($items)->filter(function ($it) {
                return ($it['eventType'] ?? '') === 'listening_party' && ($it['date'] ?? '') >= '2026-09-01';
            })->sortByDesc('date')->take(6);
            $ec = app(\App\Http\Controllers\EventsController::class);
            foreach ($items as $it) {
                $start = microtime(true);
                $counts = $ec->liveEventCounts((string) ($it['name'] ?? ''), $it['id'] ?? null);
                $ms = round((microtime(true) - $start) * 1000);
                echo $it['date'] . " | " . $it['name'] . " | " . $ms . "ms\n";
                if ($counts === null) { echo "  bridge unreachable\n"; continue; }
                echo "  total attending: " . $counts['attending'] . "\n";
                echo "  hollywood attending: " . $counts['store']['hollywood']['attending'] . "\n";
                echo "  pico attending: " . $counts['store']['pico']['attending'] . "\n";
            }
            PHP
            echo "=== done ==="
