# Checks each Discogs-linked record's genre against its Discogs release and
# fixes only the definitely-wrong ones, fills blanks (Sarah 2026-10-21). See
# app/Console/Commands/GenreDiscogsCheck.php. Takes over the Discogs-budget
# slot of discogs-genre-backfill.yml (same concurrency group). Progress shows
# on /products/genre-fix.
name: Genre check (Discogs)

on:
  # schedule added after the dry run is reviewed
  workflow_dispatch:
    inputs:
      minutes:
        description: Keep running for up to this many minutes
        required: true
        default: '8'
      skip_blank:
        description: Test the wrong-genre check only
        required: false
        default: 'false'
      limit:
        description: Stop after this many records (0 = no limit)
        required: false
        default: '0'
      commit:
        description: Actually write genres (false = dry run)
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: discogs-genre-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            echo "ssh-keyscan attempt $attempt"
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              echo "ssh-keyscan succeeded"
              exit 0
            fi
            sleep 3
          done
          echo "ssh-keyscan failed after 3 tries — continuing anyway, appleboy/ssh-action will handle host keys"
          exit 0

      - name: Run genres:discogs-check
        uses: appleboy/ssh-action@v1.2.0
        env:
          RUN_MINUTES: ${{ github.event.inputs.minutes || '8' }}
          RUN_COMMIT: ${{ github.event.inputs.commit || 'true' }}
          RUN_LIMIT: ${{ github.event.inputs.limit || '0' }}
          RUN_SKIP: ${{ github.event.inputs.skip_blank || 'false' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          envs: RUN_MINUTES,RUN_COMMIT,RUN_LIMIT,RUN_SKIP
          script: |
            set -e
            DEPLOY_DIR="/www/playlist.nivessa.com/app"
            cd "$DEPLOY_DIR"
            COMMIT_FLAG=""
            if [ "$RUN_COMMIT" = "true" ]; then
              COMMIT_FLAG="--commit"
            fi
            echo "=== running genres:discogs-check --minutes=$RUN_MINUTES $COMMIT_FLAG ==="
            php artisan genres:discogs-check --minutes="$RUN_MINUTES" --limit="$RUN_LIMIT" $COMMIT_FLAG $( [ "$RUN_SKIP" = "true" ] && echo --skip-blank )
            echo
            echo "=== done ==="
