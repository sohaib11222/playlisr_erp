# READ-ONLY diagnostic: check whether returns processed AFTER a sale was
# already paid out are eating into "earned" for departed staff (quantity -
# quantity_returned is computed live, but paid is a frozen historical total).
# One-off; delete after use.
name: Diag returns erosion

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Check return-driven erosion on departed staff (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            $businessId = \DB::table('business')->value('id');
            $names = ['zella','davis','clark','mica','clyde'];
            $users = \DB::table('users')->where('business_id', $businessId)->get(['id','first_name','last_name']);
            $users = $users->filter(function ($u) use ($names) {
                return in_array(strtolower(trim((string) $u->first_name)), $names, true);
            })->values();

            foreach ($users as $u) {
                echo "=== " . $u->first_name . " (id " . $u->id . ") ===\n";
                $rows = \DB::table('transaction_sell_lines as tsl')
                    ->join('transactions as t', 'tsl.transaction_id', '=', 't.id')
                    ->join('products as p', 'tsl.product_id', '=', 'p.id')
                    ->where('t.business_id', $businessId)
                    ->where('t.type', 'sell')
                    ->where('t.status', 'final')
                    ->where('p.created_by', $u->id)
                    ->where('tsl.quantity_returned', '>', 0)
                    ->select('tsl.id', 'tsl.quantity', 'tsl.quantity_returned', 'tsl.unit_price_inc_tax', 't.transaction_date', 'tsl.updated_at')
                    ->orderByDesc('tsl.updated_at')
                    ->limit(10)
                    ->get();
                echo "returned lines on items " . $u->first_name . " listed: " . $rows->count() . " (showing up to 10, newest return-update first)\n";
                foreach ($rows as $r) {
                    echo "  line " . $r->id . ": sold " . $r->quantity . ", returned " . $r->quantity_returned . ", orig sale " . substr($r->transaction_date,0,10) . ", line last touched " . $r->updated_at . "\n";
                }

                // Also as SELLER (created_by on the transaction, not the lister) since sales-bonus uses t.created_by
                $rows2 = \DB::table('transaction_sell_lines as tsl')
                    ->join('transactions as t', 'tsl.transaction_id', '=', 't.id')
                    ->where('t.business_id', $businessId)
                    ->where('t.type', 'sell')
                    ->where('t.status', 'final')
                    ->where('t.created_by', $u->id)
                    ->where('tsl.quantity_returned', '>', 0)
                    ->select('tsl.id', 'tsl.quantity', 'tsl.quantity_returned', 't.transaction_date', 'tsl.updated_at')
                    ->orderByDesc('tsl.updated_at')
                    ->limit(10)
                    ->get();
                echo "returned lines on sales " . $u->first_name . " rang: " . $rows2->count() . " (showing up to 10)\n";
                foreach ($rows2 as $r) {
                    echo "  line " . $r->id . ": sold " . $r->quantity . ", returned " . $r->quantity_returned . ", orig sale " . substr($r->transaction_date,0,10) . ", line last touched " . $r->updated_at . "\n";
                }
            }
            PHP
            echo "=== done ==="
