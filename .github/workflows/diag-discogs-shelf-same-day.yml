# One-off, read-only: finds the Discogs listings at a shelf location (e.g. FL414)
# and every shelf location that had listings posted the same day.
# Reads the Discogs inventory API only. Writes nothing.

name: Diag Discogs shelf same-day listings (read-only)

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Shelf location, e.g. FL414'
        default: 'FL414'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 40m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_shelf.php
            php /tmp/diag_shelf.php '${{ inputs.location }}'
            rm -f /tmp/diag_shelf.php
