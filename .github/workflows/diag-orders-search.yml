# READ-ONLY (Sarah, 2026-10-21): render the Website Orders page logic for a
# search on prod and print which orders/tabs come back. No writes.
name: Diag orders search

on:
  workflow_dispatch:
    inputs:
      q:
        description: "Search text"
        required: true

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if grep -q . ~/.ssh/known_hosts 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 0

      - name: Run Orders page search (read-only)
        uses: appleboy/ssh-action@v1.2.0
        env:
          DIAG_Q: ${{ github.event.inputs.q }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 120s
          envs: DIAG_Q
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            export DIAG_Q
            php artisan tinker --no-ansi <<'PHP'
            $q = trim((string) getenv('DIAG_Q'));
            $u = \App\User::whereNull('deleted_at')->orderBy('id')->get()->first(fn($x) => $x->can('sell.create'));
            auth()->login($u);
            if ($q === 'ALMOST') {
              $req = \Illuminate\Http\Request::create('/website-orders', 'GET', ['tab' => 'to_ship', 'almost' => '1']);
              app()->instance('request', $req);
              try { $v = app(\App\Http\Controllers\WebsiteOrdersController::class)->index($req); $d = $v->getData(); $html = $v->render(); echo 'ALMOST count=' . ($d['tabCounts']['almost_done'] ?? 'x') . ' web=' . implode(',', array_map(fn($o) => ($o['orderNumber'] ?? '') . ':' . json_encode([$o['pick_progress']['picked'] ?? null, $o['pick_progress']['total'] ?? null]), $d['orders'])) . ' discogs=' . implode(',', array_map(fn($x) => $x['id'], $d['discogsToShip'] ?? [])) . ' link=' . substr_count($html, 'class="wo-almost') . ' len=' . strlen($html) . "\n"; } catch (\Throwable $e) { echo 'ALMOST ERR ' . substr($e->getMessage(), 0, 300) . "\n"; }
              return;
            }
            if ($q === 'ALL') {
              foreach ([['source' => 'website'], ['source' => 'website', 'page' => '3'], ['source' => 'website', 'q' => 'apurva'], ['source' => 'discogs'], ['source' => 'discogs', 'q' => '17460']] as $qq) {
                $req = \Illuminate\Http\Request::create('/website-orders/all', 'GET', $qq);
                app()->instance('request', $req);
                try { $v = app(\App\Http\Controllers\WebsiteOrdersController::class)->allOrders($req); $d = $v->getData(); $html = $v->render(); echo 'ALL ' . json_encode($qq) . ': total=' . $d['total'] . ' rows=' . count($d['rows']) . ' err=' . json_encode($d['error']) . ' first=' . json_encode(array_map(fn($r) => [$r['number'] ?? null, substr((string) ($r['date'] ?? ''), 0, 10), $r['buyer'] ?? '', $r['status'] ?? ''], array_slice($d['rows'], 0, 2))) . ' len=' . strlen($html) . "\n"; } catch (\Throwable $e) { echo 'ALL ERR ' . substr($e->getMessage(), 0, 300) . "\n"; }
              }
              return;
            }
            if ($q === 'SORTS') {
              foreach (['due', 'location', 'fulfillment', 'total', 'listed'] as $sk) foreach (['to_ship', 'cant_find'] as $tab) {
                $req = \Illuminate\Http\Request::create('/website-orders', 'GET', ['tab' => $tab, 'sort' => $sk, 'dir' => 'asc']);
                app()->instance('request', $req);
                try { $html = app(\App\Http\Controllers\WebsiteOrdersController::class)->index($req)->render(); echo "SORT {$tab}/{$sk}: ok len=" . strlen($html) . "\n"; } catch (\Throwable $e) { echo "SORT {$tab}/{$sk}: ERR " . substr($e->getMessage(), 0, 200) . "\n"; }
              }
              return;
            }
            if ($q === 'ROUTE') {
              foreach ([['store' => 'warehouse'], ['store' => 'warehouse', 'late' => '1'], ['store' => 'hollywood']] as $qq) {
                $req = \Illuminate\Http\Request::create('/website-orders/pick-route', 'GET', $qq);
                app()->instance('request', $req);
                try {
                  $v = app(\App\Http\Controllers\WebsiteOrdersController::class)->pickRoute($req);
                  $d = $v->getData();
                  $html = $v->render();
                  echo 'ROUTE ' . json_encode($qq) . ': rows=' . count($d['rows']) . ' discogs=' . count(array_filter($d['rows'], fn($r) => !empty($r['order']['_discogs']))) . ' late=' . $d['lateCount'] . ' counts=' . json_encode($d['counts']) . ' len=' . strlen($html) . "\n";
                  $i = strpos($html, 'pr-area');
                  echo 'ROUTETXT: ' . substr(preg_replace('/\s+/', ' ', strip_tags(substr($html, $i, 3000))), 0, 600) . "\n";
                } catch (\Throwable $e) { echo 'ROUTE ERR ' . $e->getMessage() . ' @' . basename($e->getFile()) . ':' . $e->getLine() . "\n"; }
              }
              return;
            }
            if ($q === 'PILLS') {
              foreach ([['pickup', 'warehouse'], ['ready_ship', 'pico'], ['to_ship', 'warehouse'], ['to_ship', 'hollywood'], ['to_ship', 'pico'], ['recheck_hw', null], ['cant_find', null], ['discogs_old', null]] as [$tab, $loc]) {
                $t0 = microtime(true);
                try {
                  $req = \Illuminate\Http\Request::create('/website-orders', 'GET', array_filter(['tab' => $tab, 'location' => $loc]));
                  app()->instance('request', $req);
                  $html = app(\App\Http\Controllers\WebsiteOrdersController::class)->index($req)->render();
                  echo "PILL {$tab}/{$loc}: ok len=" . strlen($html) . ' secs=' . round(microtime(true) - $t0, 1) . ' mem=' . round(memory_get_peak_usage() / 1e6) . "MB\n";
                } catch (\Throwable $e) {
                  echo "PILL {$tab}/{$loc}: ERR " . get_class($e) . ' ' . substr($e->getMessage(), 0, 300) . ' @' . basename($e->getFile()) . ':' . $e->getLine() . "\n";
                }
              }
              return;
            }
            if ($q === 'UNSORTED') {
              $req = \Illuminate\Http\Request::create('/website-orders', 'GET', ['tab' => 'unsorted']);
              app()->instance('request', $req);
              $d = app(\App\Http\Controllers\WebsiteOrdersController::class)->index($req)->getData();
              foreach ($d['orders'] as $o) echo 'UNS ' . json_encode(['#' . ($o['orderNumber'] ?? ''), $o['createdAt'] ?? '', $o['order_status'] ?? '', $o['fulfillment_method'] ?? '', $o['payment_status'] ?? '', $o['total_amount'] ?? '', $o['pick_progress'] ? [$o['pick_progress']['picked'] ?? null, $o['pick_progress']['total'] ?? null, array_column($o['pick_progress']['lines'] ?? [], 'status')] : null, array_map(fn($i) => [($i['product_id']['name'] ?? $i['product_name'] ?? ''), !empty($i['cancelled']), !empty($i['product_id']['isPreorder'])], $o['items'] ?? []), $o['refund_log'] ?? null, $o['cancel_refund'] ?? null]) . "\n";
              return;
            }
            if ($q === 'TABS') {
              foreach (['to_ship', 'ready_ship'] as $tab) {
                $req = \Illuminate\Http\Request::create('/website-orders', 'GET', ['tab' => $tab]);
                app()->instance('request', $req);
                $view = app(\App\Http\Controllers\WebsiteOrdersController::class)->index($req);
                $vd = $view->getData();
                echo "DGDATA {$tab}: n=" . count($vd['discogsToShip'] ?? []) . ' err=' . json_encode($vd['discogsError'] ?? null) . ' first=' . json_encode(array_map(fn($x) => [$x['id'] ?? null, $x['_ready'] ?? null, $x['_left'] ?? null, array_map(fn($i) => [$i['location'] ?? null, $i['zone'] ?? null], $x['items'] ?? [])], array_slice($vd['discogsToShip'] ?? [], 0, 4))) . "\n";
                $html = $view->render();
                $i = strpos($html, 'Do these in order');
                echo "TABS {$tab}: sealed=" . substr_count($html, 'wo-cond sealed') . ' used=' . substr_count($html, 'wo-cond used') . ' picked_notes=' . substr_count($html, 'already picked') . "\n";
                echo "STEPS {$tab}: " . substr(preg_replace('/\s+/', ' ', strip_tags(substr($html, $i, 6000))), 0, 520) . "\n";
                $j = strpos($html, '<h3');
                echo "DG {$tab}: " . substr(preg_replace('/\s+/', ' ', strip_tags(substr($html, $j, 5000))), 0, 500) . "\n";
              }
              return;
            }
            if ($q === 'COND') {
              echo 'CATS: ' . json_encode(\DB::table('categories')->whereNull('deleted_at')->where('parent_id', 0)->pluck('name')) . "\n";
              $resp = (new \ReflectionMethod(\App\Http\Controllers\WebsiteOrdersController::class, 'websiteApi'));
              $resp->setAccessible(true);
              $r = $resp->invoke(app(\App\Http\Controllers\WebsiteOrdersController::class), 'GET', '/erp/orders/console?limit=300&payment_status=completed');
              $orders = $r['data'] ?? [];
              $erp = \App\Http\Controllers\WebsiteOrdersController::erpLocations($orders);
              $n = 0;
              foreach ($orders as $o) foreach (($o['items'] ?? []) as $it) {
                if (empty($it['product_id'])) continue;
                if ($n++ > 60) break 2;
                $pid = (int) ($it['product_id']['posProductId'] ?? 0);
                echo 'IT ' . json_encode([$it['product_id']['name'] ?? '', $erp[$pid]['genre'] ?? null, $it['product_id']['subCategory'] ?? null, $it['product_id']['format'] ?? null, $it['product_id']['productType'] ?? null]) . "\n";
              }
              return;
            }
            if ($q === 'CF') {
              $req = \Illuminate\Http\Request::create('/website-orders', 'GET', ['tab' => 'cant_find']);
              app()->instance('request', $req);
              $html = app(\App\Http\Controllers\WebsiteOrdersController::class)->index($req)->render();
              echo 'CF_RENDER len=' . strlen($html) . ' subBtns=' . substr_count($html, 'woSubOpen(') . ' modal=' . substr_count($html, 'id="wo-sub-modal"') . "\n";
              $sreq = \Illuminate\Http\Request::create('/website-orders/substitute-search', 'GET', ['q' => 'abbey road']);
              app()->instance('request', $sreq);
              echo 'SEARCH: ' . substr(app(\App\Http\Controllers\WebsiteOrdersController::class)->substituteSearch($sreq)->getContent(), 0, 700) . "\n";
              return;
            }
            if ($q === 'PICO') {
              foreach ([['ready_ship', 'pico'], ['to_ship', 'pico']] as [$tab, $loc]) {
                $req = \Illuminate\Http\Request::create('/website-orders', 'GET', ['tab' => $tab, 'location' => $loc]);
                app()->instance('request', $req);
                $d = app(\App\Http\Controllers\WebsiteOrdersController::class)->index($req)->getData();
                echo "PICO {$tab}: web=" . count($d['orders']) . ' discogs=' . count($d['discogsToShip'] ?? []) . "\n";
                foreach ($d['orders'] as $o) echo "  ORDER #" . ($o['orderNumber'] ?? '') . ' ' . ($o['display_name'] ?? ($o['user_id']['name'] ?? '')) . ' pack=' . \App\Http\Controllers\WebsiteOrdersController::packSpot($o) . ' shipfrom=' . json_encode(array_column($o['items'] ?? [], 'ship_from')) . ' spots=' . json_encode(\App\Http\Controllers\WebsiteOrdersController::orderSpots($o)) . ' pick=' . json_encode([$o['pick_progress']['picked'] ?? null, $o['pick_progress']['total'] ?? null]) . "\n";
              }
              return;
            }
            if ($q === 'RENDER') {
              $req = \Illuminate\Http\Request::create('/website-orders', 'GET', ['tab' => 'to_ship']);
              app()->instance('request', $req);
              $html = app(\App\Http\Controllers\WebsiteOrdersController::class)->index($req)->render();
              $i = strpos($html, 'Do these in order');
              echo 'RENDER_OK len=' . strlen($html) . "\n";
              foreach (["Couldn't reach", 'Do these in order', 'wo-steps', 'bridgeError', 'spot not saved', 'HW Basement'] as $needle) echo 'HAS ' . $needle . '=' . substr_count($html, $needle) . "\n";
              $cr = strpos($html, "Couldn't reach");
              if ($cr !== false) echo 'CR: ' . substr(strip_tags(substr($html, $cr, 600)), 0, 400) . "\n";
              $wk = strpos($html, 'class="wo-week-line"');
              echo 'WEEK: ' . substr(preg_replace('/\s+/', ' ', strip_tags(substr($html, $wk, 900))), 0, 200) . "\n";
              echo 'DISCOGS: ' . substr(preg_replace('/\s+/', ' ', strip_tags(substr($html, $i, 12000))), 0, 1500) . "\n";
              echo 'HAS_BTNS=' . substr_count(substr($html, $i), 'wo-pick-inline') . "\n";
              return;
            }
            foreach (['to_ship', 'ready_ship', 'completed'] as $tab) {
              foreach (['', 'pico'] as $loc) {
                $req = \Illuminate\Http\Request::create('/website-orders', 'GET', array_filter(['q' => $q, 'tab' => $tab, 'location' => $loc]));
                app()->instance('request', $req);
                $v = app(\App\Http\Controllers\WebsiteOrdersController::class)->index($req);
                $d = $v->getData();
                echo "TAB {$tab} LOC {$loc}: orders=" . count($d['orders'] ?? []) . ' ids=' . implode(',', array_map(fn($o) => $o['orderNumber'] ?? $o['_id'], $d['orders'] ?? [])) . ' tabs=' . json_encode(array_map(fn($o) => \App\Http\Controllers\WebsiteOrdersController::tabFor($o)[1], $d['orders'] ?? [])) . ' bridgeError=' . json_encode($d['bridgeError'] ?? null) . "\n";
              }
            }
            PHP
            echo "=== done ==="
