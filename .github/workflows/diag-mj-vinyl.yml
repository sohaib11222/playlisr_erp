# One-off, read-only: Lists in-stock Michael Jackson / Jackson vinyl with category + price.
# SELECTs only. Writes nothing.

name: Diag MJ vinyl lookup (read-only)

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Store name (hollywood or pico)'
        default: hollywood

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_mj.php
            LOC='${{ inputs.location }}' php /tmp/diag_mj.php
            rm -f /tmp/diag_mj.php
