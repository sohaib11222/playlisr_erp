name: Ops - adjust a customer's store credit

# Same as Contacts -> Adjust store credit in the ERP (audit note, store
# credit log, nivessa.com sync), for fixing mistakes from outside the UI.
# Dry run by default; refuses if the contact's name doesn't match.

on:
  workflow_dispatch:
    inputs:
      contact_id:
        description: ERP contact id
        required: true
      amount:
        description: Signed amount, e.g. -5 to remove $5
        required: true
      reason:
        description: Reason (goes in the audit note)
        required: true
      expect_name:
        description: Contact's name, as a safety check
        required: true
      apply:
        description: Apply the change (false = dry run)
        type: boolean
        default: false

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - name: Run on prod
        uses: appleboy/ssh-action@v1.2.0
        env:
          ADJ_CONTACT_ID: ${{ inputs.contact_id }}
          ADJ_AMOUNT: ${{ inputs.amount }}
          ADJ_REASON: ${{ inputs.reason }}
          ADJ_EXPECT_NAME: ${{ inputs.expect_name }}
          ADJ_APPLY: ${{ inputs.apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: ADJ_CONTACT_ID,ADJ_AMOUNT,ADJ_REASON,ADJ_EXPECT_NAME,ADJ_APPLY
          command_timeout: 5m
          script: |
            echo '' | base64 -d > /tmp/adjust_credit.php
            cd /www/playlist.nivessa.com/app && ADJ_CONTACT_ID="$ADJ_CONTACT_ID" ADJ_AMOUNT="$ADJ_AMOUNT" ADJ_REASON="$ADJ_REASON" ADJ_EXPECT_NAME="$ADJ_EXPECT_NAME" ADJ_APPLY="$ADJ_APPLY" php artisan tinker /tmp/adjust_credit.php 2>&1
            rm -f /tmp/adjust_credit.php
