# One-off, read-only: fastest-selling artists on used vinyl in-store (hollywood/pico):
# units sold, last-90-day units, revenue, median days-to-sell, units added, in stock now.
# SELECTs only. Writes nothing.

name: Diag used vinyl top artists (read-only)

on:
  workflow_dispatch:
    inputs:
      months:
        description: 'How many months back'
        default: '12'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_uva.php
            php /tmp/diag_uva.php '${{ inputs.months }}'
            rm -f /tmp/diag_uva.php
