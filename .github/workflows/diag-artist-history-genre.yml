# READ-ONLY: runs scripts/diag/artist_history_genre.php on prod. Push to diag-artist/**.
name: Diag artist-history genre

on:
  push:
    branches: ['diag-artist/**']
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run on prod
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          P=${DEPLOY_PORT:-22}
          for i in 1 2 3; do ssh-keyscan -T 10 -p $P -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && grep -q . ~/.ssh/known_hosts && break; sleep 5; done
          A=/www/playlist.nivessa.com/app
          scp -i ~/.ssh/id -P $P scripts/diag/artist_history_genre.php "$DEPLOY_USER@$DEPLOY_HOST:$A/storage/artist_history_genre.php"
          scp -i ~/.ssh/id -P $P app/Services/DiscogsReleaseImportMapper.php "$DEPLOY_USER@$DEPLOY_HOST:$A/storage/DiscogsReleaseImportMapper_branch.php"
          ssh -i ~/.ssh/id -p $P "$DEPLOY_USER@$DEPLOY_HOST" "cd $A && sed -i \"s#__DIR__ . '/../../#'\$(pwd)/#g\" storage/artist_history_genre.php && php storage/artist_history_genre.php; rm -f storage/artist_history_genre.php storage/DiscogsReleaseImportMapper_branch.php"
