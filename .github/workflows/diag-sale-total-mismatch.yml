# READ-ONLY diagnostic: list POS sales whose final_total != items + tax (last N days) — transaction
# totals, sell lines (incl. returns, line discounts, tax), payments, and any
# return transactions — to explain receipt math that doesn't add up. No writes.
name: Diag sale total mismatch

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back"
        default: "60"
        required: true

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if grep -q . ~/.ssh/known_hosts 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 0

      - name: List total mismatches (read-only)
        uses: appleboy/ssh-action@v1.2.0
        env:
          DIAG_INVOICE: ${{ github.event.inputs.days }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          envs: DIAG_INVOICE
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            export DIAG_INVOICE
            php artisan tinker --no-ansi <<'PHP'
            $d = (int) getenv('DIAG_INVOICE'); $rows = \Illuminate\Support\Facades\DB::select("SELECT t.invoice_no, t.transaction_date, l.name store, u.first_name cashier, t.final_total, t.total_before_tax, t.tax_amount, x.lines_pre, x.lines_inc, x.n FROM transactions t JOIN (SELECT transaction_id, SUM(unit_price*(quantity-quantity_returned)) lines_pre, SUM(unit_price_inc_tax*(quantity-quantity_returned)) lines_inc, COUNT(*) n FROM transaction_sell_lines GROUP BY transaction_id) x ON x.transaction_id=t.id LEFT JOIN business_locations l ON l.id=t.location_id LEFT JOIN users u ON u.id=t.created_by WHERE t.type='sell' AND t.status='final' AND t.transaction_date >= NOW() - INTERVAL ? DAY AND (t.discount_amount IS NULL OR t.discount_amount=0) ORDER BY t.transaction_date", [$d]); $over=0; $overAmt=0; $byMonth=[]; $list=[]; $all=0; foreach ($rows as $r) { $all++; $max = round(max($r->lines_pre*1.1025, $r->lines_inc*1.1025),2); $diff = round($r->final_total - $max, 2); $m = substr($r->transaction_date,0,7); $byMonth[$m]['all'] = ($byMonth[$m]['all'] ?? 0) + 1; if ($diff > 0.05) { $over++; $overAmt += $diff; $byMonth[$m]['over'] = ($byMonth[$m]['over'] ?? 0) + 1; $byMonth[$m]['amt'] = round(($byMonth[$m]['amt'] ?? 0) + $diff, 2); if ($r->transaction_date >= '2026-10-25') $list[] = "{$r->invoice_no} | {$r->transaction_date} | {$r->store} | {$r->cashier} | lines={$r->lines_pre} | tbt={$r->total_before_tax} | charged={$r->final_total} | over={$diff}"; } } echo "ALL_NO_DISCOUNT: $all\nOVER_COUNT: $over\nOVER_AMT: ".round($overAmt,2)."\n"; foreach ($byMonth as $m=>$v) echo "MONTH: $m all={$v['all']} over=".($v['over']??0)." amt=".($v['amt']??0)."\n"; foreach ($list as $x) echo "RECENT: $x\n";
            PHP
            echo "=== done ==="
