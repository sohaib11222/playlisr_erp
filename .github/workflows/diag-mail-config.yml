# READ-ONLY diagnostic: check whether the server's mail config has real SMTP
# credentials set, without ever printing the password itself. Used to
# diagnose the cashier offer-letter email failing with "530 Authentication
# required". No writes.
name: Diag mail config

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Mail config presence check (read-only, no secrets printed)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 60s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            echo "=== .env MAIL_* keys present? (values never printed) ==="
            for key in MAIL_DRIVER MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_PASSWORD MAIL_ENCRYPTION MAIL_FROM_ADDRESS MAIL_FROM_NAME; do
              line=$(grep "^${key}=" .env)
              if [ -z "$line" ]; then
                echo "$key: MISSING"
              else
                val="${line#*=}"
                if [ -z "$val" ] || [ "$val" = "null" ]; then
                  echo "$key: EMPTY"
                else
                  echo "$key: SET (len=${#val})"
                fi
              fi
            done
            echo "=== MAIL_HOST / MAIL_PORT actual values (not secret) ==="
            grep "^MAIL_HOST=" .env
            grep "^MAIL_PORT=" .env
            grep "^MAIL_ENCRYPTION=" .env
            echo "=== OFFER_MAIL_* keys present? ==="
            for key in OFFER_MAIL_HOST OFFER_MAIL_PORT OFFER_MAIL_ENCRYPTION OFFER_MAIL_USERNAME OFFER_MAIL_PASSWORD; do
              line=$(grep "^${key}=" .env)
              if [ -z "$line" ]; then
                echo "$key: MISSING"
              else
                val="${line#*=}"
                echo "$key: SET (len=${#val})"
              fi
            done
            echo "=== .env line 4 (key name + length only, value redacted) ==="
            line4=$(sed -n '4p' .env)
            key4="${line4%%=*}"
            val4="${line4#*=}"
            echo "key: [$key4] valuelen=${#val4}"
            echo "=== does .env parse under Laravel's own dotenv (not strict parse_ini_file)? ==="
            php artisan tinker --execute="echo config('app.name');" 2>&1 | tail -5

            echo "=== FIX: strip whitespace from OFFER_MAIL_PASSWORD (Google shows app passwords spaced; the value must not contain literal spaces for Laravel's dotenv parser) ==="
            cp .env .env.bak.offerpwfix
            oldline=$(grep "^OFFER_MAIL_PASSWORD=" .env)
            oldval="${oldline#OFFER_MAIL_PASSWORD=}"
            newval=$(echo "$oldval" | tr -d ' ')
            echo "before_len=${#oldval} after_len=${#newval}"
            esc_newval=$(printf '%s' "$newval" | sed -e 's/[&|]/\\&/g')
            sed -i "s|^OFFER_MAIL_PASSWORD=.*|OFFER_MAIL_PASSWORD=${esc_newval}|" .env

            echo "=== re-checking dotenv parse after fix ==="
            php artisan --version 2>&1 | tail -5

            echo "=== test-sending a REAL mpdf-generated offer letter via OfferLetterMailer to sarah@nivessa.com ==="
            php -r '
              require "vendor/autoload.php";
              $app = require_once "bootstrap/app.php";
              $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
              $kernel->bootstrap();
              try {
                  $body = view("pdf.cashier_offer_letter", [
                      "firstName" => "Sarah",
                      "fullName"  => "Sarah Test",
                      "startDate" => "September 22, 2026",
                      "jobTitle"  => "Sales Cashier",
                  ])->render();
                  $mpdf = new \Mpdf\Mpdf([
                      "tempDir" => public_path("uploads/temp"),
                      "mode"    => "utf-8",
                      "format"  => "A4",
                  ]);
                  $mpdf->WriteHTML($body);
                  $pdfBinary = $mpdf->Output("", "S");
                  echo "pdf_bytes=" . strlen($pdfBinary) . " magic=" . substr($pdfBinary, 0, 4) . "\n";
                  \App\Services\OfferLetterMailer::send("sarah@nivessa.com", "Sarah", "Sales Cashier", $pdfBinary, "Test Real Offer Letter.pdf");
                  echo "SEND_OK\n";
              } catch (\Throwable $e) {
                  echo "SEND_FAILED: " . $e->getMessage() . "\n";
              }
            ' 2>&1

            echo "=== done ==="
