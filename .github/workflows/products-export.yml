# Read-only products export. SSHes to prod, runs a pure SELECT over the
# products table (mirroring the /products list: business-scoped, non-modifier,
# non-deleted variations, aggregated stock/price), writes /tmp/products_export.csv,
# copies it back to the runner, and uploads it as a downloadable artifact.
# No writes to app data. Reuses the Deploy production SSH secrets.

name: Playlisr · products export (CSV)

on:
  workflow_dispatch:
    inputs:
      business_id:
        description: Business id to export (blank = the store with the most products)
        required: false
        default: ''

concurrency:
  group: playlisr-products-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Build CSV on prod
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          # drone-ssh runs each line as its own command, so the export script is
          # base64-encoded into a single line, decoded to a temp file, and run via
          # `php artisan tinker <file>` (full Laravel bootstrap).
          script: |
            echo "=== products export, business_id input: '${{ github.event.inputs.business_id }}' ==="
            echo '' | base64 -d > /tmp/products_export.php
            cd /www/playlist.nivessa.com/app && EXPORT_BUSINESS_ID='${{ github.event.inputs.business_id }}' php artisan tinker /tmp/products_export.php
            rm -f /tmp/products_export.php
            ls -lh /tmp/products_export.csv

      - name: Copy CSV back to runner
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          source: /tmp/products_export.csv
          target: ./out
          strip_components: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: products-export
          path: ./out/products_export.csv
          if-no-files-found: error

      - name: Clean up remote temp file
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script: rm -f /tmp/products_export.csv
