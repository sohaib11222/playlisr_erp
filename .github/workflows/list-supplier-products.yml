# One-click READ-ONLY listing: every product (id + name) ever purchased from
# a given supplier. Used to build a "here's what we zeroed" report. Never
# writes anything.

name: List supplier products

on:
  workflow_dispatch:
    inputs:
      supplier_name:
        description: 'Supplier name to match (e.g. "Adam Evan")'
        required: true
        default: "Adam Evan"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Run stock:list-supplier-products
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 10m
          script: |
            set +e
            cd /www/playlist.nivessa.com/app || { echo "cd failed"; exit 0; }
            php artisan stock:list-supplier-products "${{ github.event.inputs.supplier_name }}" 2>&1
            echo "=== done ==="
            exit 0
