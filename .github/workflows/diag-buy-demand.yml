# One-off, read-only: why does the Beta buy form give no demand bonus on a
# bulk type (e.g. 500 used R&B CDs)? Prints, per store and bulk type, the
# format/genre categories matched and the sold / on-hand numbers behind it.
# Writes nothing.

name: Diag buy demand (one-off: close answered calls logged as missed)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_buy_demand.php
            APPLY=1 php /tmp/diag_buy_demand.php
            rm -f /tmp/diag_buy_demand.php
