name: Diag recent payout ledger activity
on:
  workflow_dispatch:
    inputs:
      since:
        description: "only show payouts marked_at/from_date on/after this date"
        required: true
        default: "2026-08-20"
concurrency:
  group: production-diag
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if grep -q . ~/.ssh/known_hosts 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 0
      - name: Dump recent payout ledger entries, all users (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            SINCE_IN="${{ github.event.inputs.since }}"
            php artisan tinker --no-ansi <<PHP
            \$since = '$SINCE_IN';
            \$lf = storage_path('app/listing-commission-payouts.json');
            \$sf = storage_path('app/sales-commission-payouts.json');
            \$listing = file_exists(\$lf) ? json_decode(file_get_contents(\$lf), true) : [];
            \$sales = file_exists(\$sf) ? json_decode(file_get_contents(\$sf), true) : [];
            echo "--- listing-commission-payouts.json entries since \$since ---\n";
            \$cnt = 0;
            foreach ((array) \$listing as \$p) {
              \$when = (string) (\$p['marked_at'] ?? \$p['from_date'] ?? '');
              if (\$when >= \$since) {
                echo "  user_id=".(\$p['user_id']??'?')." name=".(\$p['name']??'?')." amount=\$".(\$p['amount']??'?')." marked_at=".(\$p['marked_at']??'?')." note=[".(\$p['note']??'')."]\n";
                \$cnt++;
              }
            }
            echo "count = \$cnt\n\n";
            echo "--- sales-commission-payouts.json entries since \$since ---\n";
            \$cnt2 = 0;
            foreach ((array) \$sales as \$p) {
              \$when = (string) (\$p['marked_at'] ?? \$p['from_date'] ?? '');
              if (\$when >= \$since) {
                echo "  user_id=".(\$p['user_id']??'?')." name=".(\$p['name']??'?')." amount=\$".(\$p['amount']??'?')." marked_at=".(\$p['marked_at']??'?')." note=[".(\$p['note']??'')."]\n";
                \$cnt2++;
              }
            }
            echo "count = \$cnt2\n";

            echo "\n--- most recent activity log entries touching listing-commissions routes ---\n";
            \$logs = \DB::table('activity_log')->where('description', 'like', '%commission%')->orWhere('log_name','like','%commission%')->orderByDesc('created_at')->limit(15)->get(['description','causer_id','created_at','properties']);
            foreach (\$logs as \$l) { echo "  ".\$l->created_at."  causer=".\$l->causer_id."  ".\$l->description."\n"; }
            PHP
            echo "=== done ==="
