# Read-only: counts customer contacts with first+last name and a phone or email. Aggregates only.
name: Diag customer account completeness

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Run on prod
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          script: |
            echo '' | base64 -d > /tmp/acct_complete.php
            cd /www/playlist.nivessa.com/app && php artisan tinker /tmp/acct_complete.php 2>&1
            rm -f /tmp/acct_complete.php
