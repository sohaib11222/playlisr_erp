# READ-ONLY diagnostic: for the people showing an "overpaid" sales credit on
# /admin/listing-commissions who no longer work here, check their user
# status/allow_login, their live sales_earned vs sales_paid, and whether their
# historical work days have a locked target snapshot (daily-target-snapshots
# JSON) or are still being recomputed live. One-off; delete after use.
name: Diag departed commission drift

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Inspect departed-staff commission drift (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            $businessId = \DB::table('business')->value('id');
            $names = ['zella','davis','clark','mica','clyde'];
            $users = \DB::table('users')->where('business_id', $businessId)
                ->whereIn(\DB::raw('LOWER(first_name)'), $names)
                ->get(['id','first_name','last_name','status','allow_login']);
            foreach ($users as $u) {
                echo "=== {$u->first_name} {$u->last_name} (id {$u->id}) status={$u->status} allow_login={$u->allow_login} ===\n";
            }

            $rc = app(\App\Http\Controllers\ReportController::class);
            $lcc = app(\App\Http\Controllers\ListingCommissionController::class);
            $from = $lcc::SALES_BONUS_FROM;
            $to = now()->toDateString();
            echo "--- salesBonusByUser($from .. $to) ---\n";
            $earned = $rc->salesBonusByUser($businessId, $from, $to);
            foreach ($users as $u) {
                $e = $earned->get($u->id);
                echo "{$u->first_name}: " . ($e ? "bonus={$e->bonus} goal={$e->goal} achieved={$e->achieved}" : "NOT IN ROWS (excluded)") . "\n";
            }

            echo "--- sales payout ledger totals ---\n";
            $payouts = json_decode(\Storage::disk('local')->get('sales-commission-payouts.json'), true) ?: [];
            $paidByUser = [];
            foreach ($payouts as $p) {
                $uid = (int) ($p['user_id'] ?? 0);
                if ($uid > 0) { $paidByUser[$uid] = ($paidByUser[$uid] ?? 0) + (float) ($p['amount'] ?? 0); }
            }
            foreach ($users as $u) {
                echo "{$u->first_name}: paid=" . ($paidByUser[$u->id] ?? 0) . "\n";
            }

            echo "--- snapshot coverage (daily-target-snapshots) ---\n";
            $snapPath = storage_path('app/daily-target-snapshots-' . $businessId . '.json');
            $snaps = is_file($snapPath) ? (json_decode(file_get_contents($snapPath), true) ?: []) : [];
            echo "total snapshot entries: " . count($snaps) . "\n";
            foreach ($users as $u) {
                $mine = array_filter(array_keys($snaps), function($k) use ($u) { return strpos($k, '_' . $u->id . '_') !== false; });
                echo "{$u->first_name} (id {$u->id}): " . count($mine) . " snapshot day(s)\n";
            }
            PHP
            echo "=== done ==="
