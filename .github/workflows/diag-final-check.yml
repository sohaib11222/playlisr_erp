# READ-ONLY diagnostic: final full-review check - correctness (all 5 known
# cases) + warm-cache timing after the TTL fix. One-off; delete after use.
name: Diag final check

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Final correctness + timing check (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 120s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            $businessId = \DB::table('business')->value('id');
            $locations = \DB::table('business_locations')->where('business_id', $businessId)->where('is_active', 1)->orderBy('name')->pluck('name', 'id');
            $lcc = app(\App\Http\Controllers\ListingCommissionController::class);
            $ref = new \ReflectionMethod($lcc, 'unpaidListeningParties');
            $ref->setAccessible(true);

            $t0 = microtime(true);
            $rows = $ref->invoke($lcc, $businessId, $locations, '2026-08-26', '2026-09-25');
            $t1 = microtime(true);
            echo "run time (warm, since already cached from prior checks today): " . round($t1 - $t0, 2) . "s\n";
            echo "count: " . count($rows) . "\n";
            foreach ($rows as $r) {
                $e = $r['estimate'];
                $names = $e ? implode('+', array_column($e['staff'], 'name')) : 'no estimate';
                $pool = $e ? $e['pool'] : 'n/a';
                echo $r['date'] . " " . $r['location_name'] . ": " . $names . " (pool $" . $pool . ")\n";
            }
            PHP
            echo "=== done ==="
