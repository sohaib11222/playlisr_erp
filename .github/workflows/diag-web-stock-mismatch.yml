# READ-ONLY diagnostic: count/list for-sale ERP products whose stock is
# summed <= 0 across all locations (the figure the website's connector API
# re-pull sums up, per Modules/Connector/Transformers/ProductResource.php),
# to spot-check against nivessa.com's "In Stock" display. No writes.
name: Diag web stock mismatch

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max sample rows to list (count is always exact)"
        required: false
        default: "50"
      sku:
        description: "Optional single SKU to check directly (per-location breakdown)"
        required: false
        default: ""

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if grep -q . ~/.ssh/known_hosts 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 0

      - name: Find for-sale products with total stock <= 0 (read-only)
        uses: appleboy/ssh-action@v1.2.0
        env:
          DIAG_LIMIT: ${{ github.event.inputs.limit }}
          DIAG_SKU: ${{ github.event.inputs.sku }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          envs: DIAG_LIMIT,DIAG_SKU
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            export DIAG_LIMIT DIAG_SKU
            php artisan tinker --no-ansi <<'PHP'
            $limit = (int) (getenv('DIAG_LIMIT') ?: 50); $sku = trim((string) getenv('DIAG_SKU')); $bizId = (int) (config('services.nivessa_web.business_id') ?: 1);
            if ($sku !== '') { $exact = \Illuminate\Support\Facades\DB::table('products')->where('sku', $sku)->select('id', 'sku', 'name', 'is_inactive', 'not_for_selling', 'business_id')->get(); echo "SKU_EXACT_PRODUCT_ROWS: " . $exact->toJson() . "\n"; $like = \Illuminate\Support\Facades\DB::table('products')->where('sku', 'LIKE', "%54144%")->select('id', 'sku', 'name', 'is_inactive', 'not_for_selling', 'business_id')->limit(20)->get(); echo "SKU_LIKE_PRODUCT_ROWS: " . $like->toJson() . "\n"; if ($exact->count() > 0) { $pid = $exact->first()->id; $allVar = \Illuminate\Support\Facades\DB::table('variations')->where('product_id', $pid)->select('id', 'product_id', 'deleted_at')->get(); echo "ALL_VARIATIONS_INCL_DELETED: " . $allVar->toJson() . "\n"; $rows = \Illuminate\Support\Facades\DB::table('variation_location_details as vld')->join('business_locations as bl', 'bl.id', '=', 'vld.location_id')->whereIn('vld.variation_id', $allVar->pluck('id'))->select('vld.variation_id', 'bl.name as location', 'vld.qty_available')->get(); echo "SKU_LOOKUP_JSON: " . $rows->toJson() . "\n"; echo "SKU_TOTAL_QTY: " . $rows->sum('qty_available') . "\n"; } }
            $totals = \Illuminate\Support\Facades\DB::table('products as p')->join('variations as v', function ($j) { $j->on('v.product_id', '=', 'p.id')->whereNull('v.deleted_at'); })->join('variation_location_details as vld', 'vld.variation_id', '=', 'v.id')->where('p.business_id', $bizId)->where('p.is_inactive', 0)->where('p.not_for_selling', 0)->groupBy('p.id', 'p.sku', 'p.name')->havingRaw('SUM(vld.qty_available) <= 0')->select('p.id as product_id', 'p.sku', 'p.name', \Illuminate\Support\Facades\DB::raw('SUM(vld.qty_available) as total_qty'))->get();
            echo "for_sale_products_with_total_qty_lte_0: " . $totals->count() . "\n";
            $sample = $totals->sortBy('total_qty')->take($limit)->values();
            echo "RESULT_JSON: " . $sample->toJson() . "\n";
            PHP
            echo "=== done ==="
