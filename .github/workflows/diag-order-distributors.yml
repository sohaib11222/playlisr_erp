# Read-only: for a list of UPCs, every distributor feed price (AMS/Alliance/
# Secretly/...), ERP stock, reorder-page orders, recent purchases + sales.
# Answers "which distributor should we order each of these from, and is it
# already on order?". SELECTs only.

name: Diag order distributors (read-only)

on:
  workflow_dispatch:
    inputs:
      upcs:
        description: 'UPCs, space/comma separated'
        required: true

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_order_dist.php
            UPCS='${{ inputs.upcs }}' php -d memory_limit=1G /tmp/diag_order_dist.php
            rm -f /tmp/diag_order_dist.php
