# READ-ONLY diagnostic: how many active, login-enabled staff have a mobile
# number on file (contact_number) vs not — informs whether the new
# task/project-assignment SMS notifications will actually reach people.
name: Diag buy approvers

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Count staff with/without a phone number (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 60s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            App\BusinessLocation::get(['id','name'])->each(function($l){ echo "loc#{$l->id} {$l->name} -> call ".App\Http\Controllers\BuyFromCustomerController::overpayContactName($l->id)."\n"; });
            foreach ([1, 2] as $loc) { $u = App\Http\Controllers\BuyApprovalController::approverFor(1, $loc); if (!$u) { echo "loc {$loc}: NO approver user\n"; continue; } $p = App\Http\Controllers\BuyApprovalController::phoneFor($u); echo "loc {$loc}: approver #{$u->id} {$u->first_name} {$u->last_name} phone=" . ($p !== '' ? 'yes (ends '.substr(preg_replace('/\D/','',$p),-4).')' : 'NONE') . "\n"; }
            App\User::where('business_id',1)->where(function($q){ foreach (['luis','zak','zac','zach','zack','zakary','zachary','zakk'] as $n) $q->orWhere('first_name','like',$n.'%')->orWhere('username','like',$n.'%'); })->get()->each(function($u){ echo "user #{$u->id} first='".$u->first_name."' last='{$u->last_name}' username='{$u->username}' status={$u->status} canApproveOverpay=".(App\Http\Controllers\BuyFromCustomerController::canApproveOverpay($u)?'YES':'no')." manager=".(App\Http\Controllers\ChooseRoleController::userCanManager($u)?'yes':'no')."\n"; });
            App\BuyCustomerOffer::where('business_id',1)->where('status','accepted')->where('accepted_at','>=',now()->subDays(14))->get(['id','created_by','final_offer_cash','final_offer_credit','payout_type','price_override_reason','accepted_at'])->filter(function($o){ return in_array($o->created_by, App\User::where('business_id',1)->where(function($q){ $q->where('first_name','like','luis%')->orWhere('first_name','like','za%'); })->pluck('id')->all()); })->each(function($o){ echo "offer #{$o->id} by={$o->created_by} cash={$o->final_offer_cash} credit={$o->final_offer_credit} {$o->payout_type} {$o->accepted_at} reason=".mb_substr((string)$o->price_override_reason,0,140)."\n"; });
            echo "Quo key set: " . (app(App\Services\OpenPhoneService::class)->apiKey() !== '' ? 'yes' : 'no') . "\n";
            echo "storage writable: " . (is_writable(storage_path('app')) ? 'yes' : 'no') . "\n";
            PHP
            php artisan route:list 2>/dev/null | grep -i "buy-approval\|request-approval" 
            echo "=== done ==="
