# READ-ONLY diagnostic: list every listening_party event with no "Listening
# party" payout logged yet (same criteria /admin/party-bonus uses), across
# all time, not just the page's default 14-day window. One-off; delete after
# use.
name: Diag unpaid parties

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: List unpaid listening parties (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 60s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            $businessId = \DB::table('business')->value('id');
            $events = \App\Http\Controllers\EventsController::load($businessId)['items'] ?? [];
            $payoutsRaw = \Storage::disk('local')->exists('sales-commission-payouts.json')
                ? json_decode(\Storage::disk('local')->get('sales-commission-payouts.json'), true)
                : [];
            $payouts = is_array($payoutsRaw) ? $payoutsRaw : [];
            $paidDates = [];
            foreach ($payouts as $p) {
                $note = (string) ($p['note'] ?? '');
                if (stripos($note, 'Listening party') === 0) {
                    $d = substr((string) ($p['from_date'] ?? $p['marked_at'] ?? ''), 0, 10);
                    if ($d !== '') { $paidDates[$d] = ($paidDates[$d] ?? 0) + (float) ($p['amount'] ?? 0); }
                }
            }
            $today = date('Y-m-d');
            $all = [];
            $unpaid = [];
            foreach ($events as $it) {
                if (($it['eventType'] ?? '') !== 'listening_party') { continue; }
                $d = (string) ($it['date'] ?? '');
                if ($d === '' || $d > $today) { continue; }
                $all[] = $d;
                $loc = implode(',', (array) ($it['location'] ?? []));
                $name = (string) ($it['name'] ?? '?');
                if (isset($paidDates[$d])) {
                    echo "PAID   $d | $name | $loc | \${$paidDates[$d]}\n";
                } else {
                    $unpaid[] = "$d | $name | $loc";
                }
            }
            sort($all);
            echo "--- earliest listening_party date on file: " . ($all[0] ?? 'none') . " ---\n";
            echo "--- " . count($unpaid) . " UNPAID ---\n";
            foreach ($unpaid as $u) { echo "UNPAID $u\n"; }
            PHP
            echo "=== done ==="
