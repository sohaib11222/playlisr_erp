# READ-ONLY diagnostic: Hollywood Clover charges 9/27 22:00 - 9/28 02:00. One-off.
name: Diag hw late

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then exit 0; fi
            sleep 5
          done
          exit 0
      - name: Dump (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 90s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            foreach (\DB::table('clover_payments')->where('location_id',2)->where('created_at','>=','2026-09-27 22:00:00')->where('created_at','<=','2026-09-28 02:00:00')->orderBy('created_at')->get(['id','paid_at','created_at','amount','result']) as $c) { echo "CLV id={$c->id} paid={$c->paid_at} created={$c->created_at} {$c->amount} {$c->result}\n"; }
            PHP
