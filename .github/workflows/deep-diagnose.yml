# Deep diagnostic — tests every layer of the request path so we know
# WHERE the site is broken: nginx, php-fpm, Laravel, or the public network.

name: Deep diagnose

on:
  workflow_dispatch:

concurrency:
  group: production-restart
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Test from GitHub runner (outside)
        run: |
          echo "=== from outside (GitHub Actions runner) ==="
          for url in https://playlist.nivessa.com/ https://playlist.nivessa.com/login; do
            echo "--- $url ---"
            curl -v -s -o /tmp/body.html -w "HTTP %{http_code} · time %{time_total}s · size %{size_download}\n" -m 15 "$url" 2>&1 | tail -20
          done

      - name: Test from inside the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 240s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app

            echo "=== live repro: hit the site 5x back-to-back like a browser would ==="
            for i in 1 2 3 4 5; do
              curl -s -o /dev/null -w "try $i: HTTP %{http_code} · time %{time_total}s\n" -m 12 https://playlist.nivessa.com/login 2>&1
            done
            echo

            echo "=== load average / uptime ==="
            uptime
            echo

            echo "=== memory ==="
            free -h
            echo

            echo "=== disk ==="
            df -h / 2>&1 | tail -3
            echo "--- top-level usage under /www (what's eating the 185G) ---"
            du -sh /www/*/ 2>/dev/null | sort -rh | head -10
            echo

            echo "=== nginx: listening sockets + active connection count ==="
            ss -ltn 2>/dev/null | head -20
            echo "--- ss summary (established/time-wait counts etc) ---"
            ss -s 2>/dev/null
            echo

            echo "=== nginx worker_connections config vs systemctl status ==="
            grep -r "worker_connections\|worker_processes" /etc/nginx/nginx.conf 2>/dev/null
            systemctl status nginx --no-pager -n 10 2>&1 | head -25
            echo "--- nginx error log tail (last 60 lines, any host) ---"
            tail -60 /var/log/nginx/error.log 2>&1
            echo

            echo "=== php-fpm: pool config (max_children etc) ==="
            grep -E "^pm |^pm\.|^listen " /etc/php/7.4/fpm/pool.d/*.conf 2>/dev/null
            echo "--- php-fpm service status ---"
            systemctl status php7.4-fpm --no-pager -n 10 2>&1 | head -25
            echo "--- php-fpm error log tail, looking for 'server reached pm.max_children' ---"
            tail -100 /var/log/php7.4-fpm.log 2>&1
            echo "--- count of 'max_children' warnings today ---"
            grep -c "max_children" /var/log/php7.4-fpm.log 2>&1
            echo

            echo "=== mysql connection check ==="
            mysqladmin ping 2>&1 || true
            mysqladmin status 2>&1 || true
            echo

            echo "=== redis check ==="
            redis-cli ping 2>&1 || true
            echo

            echo "=== OOM killer activity today (would explain sudden hangs) ==="
            dmesg -T 2>/dev/null | grep -i "out of memory\|oom-kill\|killed process" | tail -20
            journalctl -k --since "today" 2>&1 | grep -i "out of memory\|oom" | tail -20
            echo

            echo "=== fail2ban status (is something getting banned/dropped intermittently) ==="
            fail2ban-client status 2>&1 || echo "fail2ban not available"
            echo

            echo "=== top 10 processes by CPU and by memory right now ==="
            ps aux --sort=-%cpu 2>&1 | head -11
            echo
            ps aux --sort=-%mem 2>&1 | head -11
            echo

            echo "=== Laravel boot test ==="
            cd /www/playlist.nivessa.com/app
            php artisan --version 2>&1 | head -5
            php artisan route:list 2>&1 | head -3

            echo
