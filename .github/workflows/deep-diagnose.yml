# Deep diagnostic — tests every layer of the request path so we know
# WHERE the site is broken: nginx, php-fpm, Laravel, or the public network.

name: Deep diagnose

on:
  workflow_dispatch:

concurrency:
  group: production-restart
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Test from GitHub runner (outside)
        run: |
          echo "=== from outside (GitHub Actions runner) ==="
          for url in https://playlist.nivessa.com/ https://playlist.nivessa.com/login; do
            echo "--- $url ---"
            curl -v -s -o /tmp/body.html -w "HTTP %{http_code} · time %{time_total}s · size %{size_download}\n" -m 15 "$url" 2>&1 | tail -20
          done

      - name: Test from inside the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 60s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app

            echo "=== nginx listening sockets ==="
            ss -ltn 2>/dev/null | head -20
            echo

            echo "=== test localhost:80 (plain) ==="
            curl -v -s -o /tmp/b.html -w "HTTP %{http_code} · time %{time_total}s\n" -m 10 http://localhost/ 2>&1 | tail -15
            echo

            echo "=== test localhost:443 (TLS, allow self-signed) ==="
            curl -kv -s -o /tmp/b.html -w "HTTP %{http_code} · time %{time_total}s\n" -m 10 https://localhost/ 2>&1 | tail -15
            echo

            echo "=== test playlist.nivessa.com/login from inside ==="
            curl -v -s -o /tmp/b.html -w "HTTP %{http_code} · time %{time_total}s\n" -m 10 https://playlist.nivessa.com/login 2>&1 | tail -20
            echo

            echo "=== php-fpm pool status ==="
            systemctl status php7.4-fpm --no-pager -n 5 2>&1 | head -20
            echo

            echo "=== nginx status ==="
            systemctl status nginx --no-pager -n 5 2>&1 | head -20
            echo

            echo "=== laravel daily log (latest) ==="
            ls -la storage/logs/ 2>&1 | tail -5
            LOG="$(ls -t storage/logs/laravel-*.log 2>/dev/null | head -1)"
            echo "latest log: $LOG"

            echo "--- ERROR-level lines by hour (today) ---"
            grep -oE "^\[2026-09-02 [0-9]{2}" "$LOG" 2>&1 | sort | uniq -c
            echo

            echo "--- distinct ERROR/CRITICAL messages today (deduped, first line only) ---"
            grep -E "\.(ERROR|CRITICAL|EMERGENCY):" "$LOG" 2>&1 | sed -E 's/"contact_id":[0-9]+/"contact_id":N/' | sort | uniq -c | sort -rn | head -30
            echo

            echo "--- normalized error signature counts, business hours 10:00-17:00 today (strips IDs/timestamps) ---"
            grep -E "^\[2026-09-02 (1[0-6]):" "$LOG" 2>&1 \
              | grep -E "\.(ERROR|CRITICAL|EMERGENCY):" \
              | sed -E 's/^\[[^]]+\] [a-z]+\.(ERROR|CRITICAL|EMERGENCY): //' \
              | sed -E 's/[0-9]+/N/g' \
              | cut -c1-140 \
              | sort | uniq -c | sort -rn | head -20
            echo

            echo "--- one full raw example line for the single most common daytime signature ---"
            TOPSIG=$(grep -E "^\[2026-09-02 (1[0-6]):" "$LOG" 2>&1 | grep -E "\.(ERROR|CRITICAL|EMERGENCY):" | sed -E 's/^\[[^]]+\] [a-z]+\.(ERROR|CRITICAL|EMERGENCY): //' | sed -E 's/[0-9]+/N/g' | cut -c1-80 | sort | uniq -c | sort -rn | head -1 | sed -E 's/^ *[0-9]+ //')
            echo "top signature (normalized): $TOPSIG"
            grep -E "^\[2026-09-02 (1[0-6]):" "$LOG" 2>&1 | grep -E "\.(ERROR|CRITICAL|EMERGENCY):" | grep -F "$(echo "$TOPSIG" | cut -c1-40)" | tail -3
            echo

            echo "--- invalid_client / client authentication failed: full context (30 lines around 3 occurrences) ---"
            grep -n "client authentication failed" "$LOG" 2>&1 | tail -3 | cut -d: -f1 | while read -r ln; do
              echo "== around line $ln =="
              sed -n "$((ln>15?ln-15:1)),$((ln+20))p" "$LOG" 2>&1
              echo
            done
            echo

            echo "--- 'total_rp' non-object: full context ---"
            grep -n "total_rp' of non-object" "$LOG" 2>&1 | tail -1 | cut -d: -f1 | while read -r ln; do
              sed -n "$((ln>10?ln-10:1)),$((ln+25))p" "$LOG" 2>&1
            done
            echo

            echo "--- close_register_modal / CashRegisterController(517) occurrences TODAY across ALL hours ---"
            grep -n "close_register_modal\|CashRegisterController.php(517)\|CashRegisterController.php:517" "$LOG" 2>&1 | tail -20
            echo

            echo "--- grep register/close-register keyword ERROR lines today, ALL hours (not just 10-16) ---"
            grep -inE "\.(ERROR|CRITICAL):" "$LOG" 2>&1 | grep -iE "register|close.?out|end.?shift" | tail -40
            echo

            echo "--- 500/exception counts TODAY grouped by hour (all severities incl WARNING) ---"
            grep -oE "^\[2026-09-02 [0-9]{2}" "$LOG" 2>&1 | sort | uniq -c
            echo "--- ERROR-only counts TODAY grouped by hour ---"
            grep -E "\.(ERROR|CRITICAL|EMERGENCY):" "$LOG" 2>&1 | grep -oE "^\[2026-09-02 [0-9]{2}" | sort | uniq -c
            echo

            echo "--- POS / register / sell related errors today ---"
            grep -inE "\.(ERROR|CRITICAL):" "$LOG" 2>&1 | grep -iE "pos|register|sell|cashier|checkout" | tail -40
            echo

            echo "--- most recent 15 ERROR/CRITICAL stack traces (first frame only) ---"
            grep -nE "\.(ERROR|CRITICAL):" "$LOG" 2>&1 | tail -15
            echo

            echo "=== system load / disk / memory ==="
            uptime
            df -h / 2>&1 | tail -3
            free -h
            echo

            echo "=== mysql connection check ==="
            mysqladmin ping 2>&1 || true
            mysqladmin status 2>&1 || true
            echo

            echo "=== redis check ==="
            redis-cli ping 2>&1 || true
            echo

            echo "=== Laravel boot test ==="
            php artisan --version 2>&1 | head -5
            php artisan route:list 2>&1 | head -3
