# Deep diagnostic — tests every layer of the request path so we know
# WHERE the site is broken: nginx, php-fpm, Laravel, or the public network.

name: Deep diagnose

on:
  workflow_dispatch:

concurrency:
  group: production-restart
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Test from GitHub runner (outside)
        run: |
          echo "=== from outside (GitHub Actions runner) ==="
          for url in https://playlist.nivessa.com/ https://playlist.nivessa.com/login; do
            echo "--- $url ---"
            curl -v -s -o /tmp/body.html -w "HTTP %{http_code} · time %{time_total}s · size %{size_download}\n" -m 15 "$url" 2>&1 | tail -20
          done

      - name: Test from inside the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 240s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app

            echo "=== set SYSTEM_ALERT_EMAIL in prod .env if not already present ==="
            if grep -q "^SYSTEM_ALERT_EMAIL=" .env 2>/dev/null; then
              echo "already set: $(grep '^SYSTEM_ALERT_EMAIL=' .env)"
            else
              echo "SYSTEM_ALERT_EMAIL=sarah@nivessa.com" >> .env
              echo "added SYSTEM_ALERT_EMAIL=sarah@nivessa.com"
            fi
            echo

            echo "=== clear config cache so the new env var + command take effect ==="
            php artisan config:clear 2>&1
            echo

            echo "=== mail config sanity check (no password shown) ==="
            grep -E "^MAIL_MAILER=|^MAIL_DRIVER=|^MAIL_HOST=|^MAIL_PORT=|^MAIL_USERNAME=|^MAIL_ENCRYPTION=|^MAIL_FROM_ADDRESS=" .env 2>&1
            echo "MAIL_PASSWORD is set: $(grep -q '^MAIL_PASSWORD=.' .env 2>/dev/null && echo yes || echo NO/EMPTY)"
            echo

            echo "=== smoke test: force the alert to fire end-to-end (threshold=0) ==="
            php artisan system:check-disk-space --threshold=0 2>&1
            echo

            echo "=== clear the dedup lock the smoke test just set, so a real alert isn't suppressed for 6h ==="
            php artisan tinker --execute="\Illuminate\Support\Facades\Cache::forget('system.disk_space_alert.last_sent'); echo 'cleared';" 2>&1
            echo

            echo "=== real disk usage right now (for reference, not the forced test above) ==="
            df -h / 2>&1 | tail -3

            echo
