# One-off, read-only: what to put out more of. Per store, 90d sales vs
# on-hand by category+genre (weeks of supply, sold-out titles, stock in
# warehouse/other store), top artists vs on hand, customer wants, POS
# search misses. SELECTs + session temp tables only. Writes nothing.

name: Diag restock signals (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_restock.php
            php /tmp/diag_restock.php
            rm -f /tmp/diag_restock.php
