# Read-only: where /reports/reorder's "on order" comes from for a title regex
# (page-logged orders + ERP purchases), plus sales, stock, bin counts. SELECTs only.

name: Diag reorder on-order sources (read-only)

on:
  workflow_dispatch:
    inputs:
      artists:
        description: 'Artist/title regex'
        default: 'journals'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_on_order.php
            ARTISTS='${{ inputs.artists }}' php -d memory_limit=1G /tmp/diag_on_order.php
            rm -f /tmp/diag_on_order.php
