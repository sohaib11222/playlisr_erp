# Read-only: full category + genre profit mix per customer neighborhood (nearby rate centers merged) (phone exchange -> rate center).
# Counts and dollars only, no names or numbers. Excludes Whatnot and walk-in (default) sales.
name: Diag neighborhood categories

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Run on prod
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/k && chmod 600 /tmp/k
          O="-o StrictHostKeyChecking=no"
          scp -i /tmp/k -P ${{ steps.flags.outputs.ssh_port }} $O .github/diag-data/la-phone-exchange-lut.b64 "$DEPLOY_USER@$DEPLOY_HOST:/tmp/hood_lut.b64"
          ssh -i /tmp/k -p ${{ steps.flags.outputs.ssh_port }} $O "$DEPLOY_USER@$DEPLOY_HOST" "echo '' | base64 -d > /tmp/hoodcats.php && cd /www/playlist.nivessa.com/app && php artisan tinker /tmp/hoodcats.php 2>&1; rm -f /tmp/hoodcats.php /tmp/hood_lut.b64"
          rm -f /tmp/k
