; Nivessa POS: large orders (e.g. 103-item cash sale) submit one POST field
; per product column. ~17 fields x 100+ items blows past PHP's default
; max_input_vars (1000), which silently TRUNCATES the products[] array ->
; the sale finalize 500s and the POS shows "something went wrong, try again
; later". Raise the limit so big rings go through. max_input_vars is
; PHP_INI_PERDIR, so .user.ini (read by PHP-FPM) is the right place for it.
max_input_vars = 10000

; Headroom for the larger payloads that come with big orders.
post_max_size = 32M
